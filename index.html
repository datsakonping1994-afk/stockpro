<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stock Pro Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090f;--bg2:#0f0f1a;--bg3:#141420;--bg4:#1a1a2a;--border:#1e1e32;--accent:#00d4ff;--green:#00e676;--red:#ff4466;--yellow:#ffd700;--purple:#a855f7;--text:#f0f6ff;--text2:#c0cce0;--dim:#5a6a80;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Sarabun',sans-serif;font-size:15px;padding:14px;}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.logo{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--accent);letter-spacing:2px;}
.live-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--green);background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.3);padding:3px 10px;border-radius:20px;display:flex;align-items:center;gap:5px;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
/* ── Zone alert animations ── */
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(255,68,102,0)}50%{box-shadow:0 0 0 6px rgba(255,68,102,0.25)}}
@keyframes pulse-green{0%,100%{box-shadow:0 0 0 0 rgba(0,230,118,0)}50%{box-shadow:0 0 0 6px rgba(0,230,118,0.2)}}
.card.zone-alert-s{animation:pulse-red 1.6s ease-in-out infinite;}
.card.zone-alert-r{animation:pulse-green 1.6s ease-in-out infinite;}
/* ── Toast notification ── */
#toast-container{position:fixed;bottom:20px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.toast{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:9px 14px;border-radius:8px;pointer-events:auto;opacity:0;transform:translateX(20px);transition:all 0.3s ease;max-width:280px;line-height:1.5;}
.toast.show{opacity:1;transform:translateX(0);}
.toast.toast-s{background:rgba(20,5,10,0.97);border:1px solid rgba(255,68,102,0.6);color:#ff8899;}
.toast.toast-r{background:rgba(5,15,10,0.97);border:1px solid rgba(0,230,118,0.5);color:#66ffaa;}
.summary{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.chip{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text2);}
.chip .val{font-size:18px;font-weight:600;display:block;color:var(--text);}
.controls{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:8px 14px;border-radius:7px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;white-space:nowrap;transition:all 0.15s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.search{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:7px;font-family:'IBM Plex Mono',monospace;font-size:12px;width:130px;}
.search:focus{outline:none;border-color:var(--accent);}
.statusbar{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);margin-bottom:10px;min-height:16px;}
.alert-panel{background:var(--bg2);border:1px solid rgba(255,215,0,0.3);border-radius:10px;padding:12px 14px;margin-bottom:12px;display:none;}
.alert-panel.show{display:block;}
.alert-h{display:flex;justify-content:space-between;margin-bottom:8px;}
.alert-h span{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--yellow);}
.alert-list{display:flex;flex-wrap:wrap;gap:5px;}
.alert-chip{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:4px 10px;border-radius:5px;cursor:pointer;}
.alert-chip.crit{background:rgba(255,68,102,0.1);border:1px solid rgba(255,68,102,0.4);color:var(--red);}
.alert-chip.warn{background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.3);color:var(--yellow);}
.panel{display:none;background:var(--bg2);border-radius:10px;padding:14px;margin-bottom:12px;}
.panel.show{display:block;}
.panel-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.panel-title{font-family:'IBM Plex Mono',monospace;font-size:13px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.card.hidden{display:none;}
.card-top{padding:12px 14px 10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.ticker{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--text);}
.company{font-size:12px;color:var(--dim);margin-top:2px;}
.price{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;text-align:right;}
.chg{font-family:'IBM Plex Mono',monospace;font-size:13px;text-align:right;margin-top:2px;}
/* Sparkline */
.sparkline-wrap{padding:0 14px 0;margin-top:-2px;position:relative;height:90px;}
.sparkline-canvas{width:100%;height:90px;display:block;}
.spark-vol-bar{position:absolute;bottom:0;background:rgba(0,212,255,0.15);border-radius:1px 1px 0 0;transition:height 0.3s;}
/* Volume row */
.vol-row{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 14px 6px;border-bottom:1px solid var(--border);}
.vol-label{color:var(--dim);}
.vol-val{color:var(--text2);}
.vol-ratio{font-size:10px;padding:1px 6px;border-radius:3px;}
.vol-ratio.high{background:rgba(0,230,118,0.1);color:var(--green);border:1px solid rgba(0,230,118,0.3);}
.vol-ratio.low{background:rgba(255,68,102,0.1);color:var(--red);border:1px solid rgba(255,68,102,0.3);}
.vol-ratio.norm{background:rgba(255,215,0,0.08);color:var(--yellow);border:1px solid rgba(255,215,0,0.25);}
/* MA row */
.ma-row{display:flex;gap:5px;padding:6px 0 4px;flex-wrap:wrap;}
.ma-chip{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:3px;display:flex;gap:4px;align-items:center;}
.ma-chip.above{background:rgba(0,230,118,0.07);border:1px solid rgba(0,230,118,0.25);color:rgba(0,230,118,0.9);}
.ma-chip.below{background:rgba(255,68,102,0.07);border:1px solid rgba(255,68,102,0.25);color:rgba(255,68,102,0.9);}
.ma-chip.na{background:var(--bg3);border:1px solid var(--border);color:var(--dim);}
.ma-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;}
.ma-loading{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);padding:4px 0;}
.up{color:var(--green);}.dn{color:var(--red);}.flat{color:var(--dim);}
.badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:middle;}
.badge.green{background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.3);color:var(--green);}
.badge.yellow{background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.3);color:var(--yellow);}
.badge.red{background:rgba(255,68,102,0.1);border:1px solid rgba(255,68,102,0.4);color:var(--red);}
.card-body{padding:10px 14px;}
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;margin-bottom:10px;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:7px 12px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;}
.tab:hover{color:var(--text2);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-pane{display:none;}.tab-pane.active{display:block;}
.prox-row{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);margin-bottom:4px;}
.prox-val.green{color:var(--green);}.prox-val.yellow{color:var(--yellow);}.prox-val.red{color:var(--red);}
.range-bar-wrap{position:relative;margin-bottom:14px;}
.range-bar{height:6px;border-radius:3px;background:linear-gradient(to right,#ff4466 0%,#ffd700 35%,#ffd700 65%,#00e676 100%);position:relative;}
.range-needle{position:absolute;top:-5px;width:3px;height:16px;border-radius:2px;background:#fff;box-shadow:0 0 6px rgba(255,255,255,0.6);transform:translateX(-50%);transition:left 0.5s ease;}
.range-labels{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:9px;margin-top:3px;}
.range-lbl-s{color:rgba(255,68,102,0.7);}
.range-lbl-r{color:rgba(0,230,118,0.7);}
.range-lbl-mid{color:var(--dim);text-align:center;flex:1;}
.zone-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border-radius:3px;display:inline-block;margin-left:6px;}
.zone-tag.near-s{background:rgba(255,68,102,0.1);border:1px solid rgba(255,68,102,0.4);color:var(--red);}
.zone-tag.near-r{background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.3);color:var(--green);}
.zone-tag.mid{background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.25);color:var(--yellow);}
.zone-tag.safe{background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.2);color:var(--accent);}
.levels-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.levels-lbl{font-size:11px;font-family:'IBM Plex Mono',monospace;margin-bottom:4px;}
.levels-lbl.s{color:rgba(255,68,102,0.7);}.levels-lbl.r{color:rgba(0,230,118,0.7);}
.level{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:4px 8px;background:var(--bg3);border-radius:4px;margin-bottom:3px;display:flex;justify-content:space-between;}
.level.s1,.level.s2,.level.s3{border-left:2px solid rgba(255,68,102,0.4);color:rgba(255,68,102,0.9);}
.level.r1,.level.r2,.level.r3{border-left:2px solid rgba(0,230,118,0.4);color:rgba(0,230,118,0.9);}
.level-tag{opacity:0.5;font-size:10px;}
.rsi-row{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--bg3);border-radius:6px;margin-bottom:8px;}
.rsi-lbl{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);min-width:24px;}
.rsi-track{flex:1;height:5px;background:var(--bg4);border-radius:2px;position:relative;}
.rsi-zones{position:absolute;inset:0;display:flex;border-radius:2px;overflow:hidden;}
.rsi-os{width:30%;background:rgba(0,230,118,0.15);}.rsi-mid{width:40%;}.rsi-ob{width:30%;background:rgba(255,68,102,0.15);}
.rsi-needle{position:absolute;top:-4px;width:3px;height:13px;border-radius:2px;transform:translateX(-50%);transition:left 0.5s;}
.rsi-val{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;min-width:32px;text-align:right;}
.rsi-tag{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 6px;border-radius:3px;}
.rsi-ob-tag{color:var(--red);background:rgba(255,68,102,0.1);border:1px solid rgba(255,68,102,0.3);}
.rsi-os-tag{color:var(--green);background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.3);}
.rsi-mid-tag{color:var(--yellow);background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.25);}
.news-item{padding:7px 0;border-bottom:1px solid var(--border);}
.news-item:last-child{border-bottom:none;}
.news-hl{font-size:13px;color:var(--text);line-height:1.5;margin-bottom:3px;}
.news-sum{font-size:11px;color:var(--text2);margin-bottom:3px;}
.news-meta{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);display:flex;gap:8px;}
.fund-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.fund-item{background:var(--bg3);border-radius:6px;padding:7px 10px;}
.fund-key{font-size:11px;color:var(--text2);font-family:'IBM Plex Mono',monospace;margin-bottom:2px;}
.fund-val{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--text);}
.fund-val.green{color:var(--green);}.fund-val.red{color:var(--red);}
.earn-badge-sm{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;display:inline-block;margin-top:6px;background:rgba(168,85,247,0.1);border:1px solid rgba(168,85,247,0.3);color:#c084fc;}
.trade-lbl{font-size:11px;color:var(--text2);font-family:'IBM Plex Mono',monospace;margin-bottom:5px;}
.input-row{display:flex;gap:5px;margin-bottom:7px;align-items:center;}
.tinput{flex:1;background:var(--bg4);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:12px;min-width:0;}
.tinput:focus{outline:none;border-color:var(--accent);}
.tlbl{font-size:10px;color:var(--dim);font-family:'IBM Plex Mono',monospace;white-space:nowrap;}
.rr-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--bg3);border-radius:6px;padding:8px;margin-bottom:6px;text-align:center;}
.rr-key{font-size:10px;color:var(--text2);font-family:'IBM Plex Mono',monospace;}
.rr-val{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;}
.tresult{background:var(--bg3);border-radius:6px;padding:7px 9px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text2);line-height:1.7;white-space:pre-line;}
.buy-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;}
.buy-popup{background:var(--bg2);border:1px solid rgba(0,230,118,0.4);border-radius:12px;padding:18px;max-width:340px;width:100%;font-family:'IBM Plex Mono',monospace;box-shadow:0 0 30px rgba(0,230,118,0.15);}
.buy-popup-title{font-size:15px;font-weight:700;color:var(--green);margin-bottom:12px;}
.buy-popup-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;}
.buy-popup-label{color:var(--dim);}
.buy-popup-val{font-weight:600;color:var(--text);}
.buy-popup-divider{border:none;border-top:1px solid var(--border);margin:10px 0;}
.buy-popup-summary{font-size:11px;color:var(--text2);line-height:1.6;margin-bottom:12px;}
.buy-popup-btns{display:flex;gap:8px;}
.buy-popup-btns button{flex:1;padding:8px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;}
.buy-popup-goto{background:rgba(0,230,118,0.15);border:1px solid rgba(0,230,118,0.3)!important;color:var(--green);}
.buy-popup-close{background:var(--bg3);color:var(--dim);}
.card-status-dot{position:absolute;bottom:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--dim);transition:background 0.3s;}
.card-status-dot.loading{background:var(--yellow);animation:blink 1s infinite;}
.card-status-dot.ready{background:var(--green);}
.card{position:relative;}
.ai-btn{width:100%;background:linear-gradient(135deg,rgba(0,212,255,0.1),rgba(168,85,247,0.1));border:1px solid rgba(0,212,255,0.3);color:var(--accent);padding:7px;border-radius:5px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:12px;margin-bottom:8px;transition:all 0.2s;}
.ai-btn:hover{background:linear-gradient(135deg,rgba(0,212,255,0.2),rgba(168,85,247,0.2));border-color:rgba(0,212,255,0.6);}
.ai-btn:disabled{opacity:0.5;cursor:not-allowed;}
/* ── AI Chat UI ── */
.ai-chat{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow-y:auto;margin-bottom:8px;scroll-behavior:smooth;}
.ai-msg{border-radius:8px;padding:9px 12px;font-size:12px;line-height:1.65;animation:fadeIn 0.2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.ai-msg.assistant{background:var(--bg3);border:1px solid var(--border);color:var(--text2);}
.ai-msg.user{background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);color:var(--text);align-self:flex-end;max-width:90%;}
.ai-msg.error{background:rgba(255,68,102,0.08);border:1px solid rgba(255,68,102,0.3);color:var(--red);}
.ai-typing::after{content:'▋';animation:blink 0.7s infinite;color:var(--accent);}
.ai-input-row{display:flex;gap:5px;}
.ai-input{flex:1;background:var(--bg4);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-family:'Sarabun',sans-serif;font-size:12px;outline:none;transition:border-color 0.2s;}
.ai-input:focus{border-color:rgba(0,212,255,0.5);}
.ai-input::placeholder{color:var(--dim);}
.ai-send{background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.4);color:var(--accent);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:13px;transition:all 0.15s;flex-shrink:0;}
.ai-send:hover{background:rgba(0,212,255,0.25);}
.ai-send:disabled{opacity:0.4;cursor:not-allowed;}
.ai-result{font-size:12px;color:var(--text2);line-height:1.6;white-space:pre-line;}
.ai-indicator-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
.ai-ind-chip{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:3px;background:var(--bg3);border:1px solid var(--border);color:var(--dim);}
.ai-ind-chip.bull{background:rgba(0,230,118,0.07);border-color:rgba(0,230,118,0.3);color:var(--green);}
.ai-ind-chip.bear{background:rgba(255,68,102,0.07);border-color:rgba(255,68,102,0.3);color:var(--red);}
.ai-ind-chip.neut{background:rgba(255,215,0,0.07);border-color:rgba(255,215,0,0.25);color:var(--yellow);}
.mnews-item{background:var(--bg3);border-radius:7px;padding:9px 12px;margin-bottom:6px;}
.mnews-hl{font-size:13px;color:var(--text);margin-bottom:3px;}
.mnews-sum{font-size:11px;color:var(--text2);margin-bottom:3px;}
.mnews-src{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);}
.earn-hdr{display:grid;grid-template-columns:60px 1fr 90px 65px 75px 90px;gap:6px;padding:4px 10px 8px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);border-bottom:1px solid var(--border);margin-bottom:6px;}
.earn-row{display:grid;grid-template-columns:60px 1fr 90px 65px 75px 90px;gap:6px;padding:8px 10px;border-radius:7px;margin-bottom:4px;align-items:center;cursor:pointer;border:1px solid var(--border);}
.earn-row:hover{opacity:0.8;}
.earn-ticker{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;}
.earn-name{font-size:12px;color:var(--text2);}
.earn-date{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text2);}
.earn-eps,.earn-rev{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);}
.earn-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:4px;display:inline-block;}
.earn-done{background:rgba(0,230,118,0.1);border:1px solid rgba(0,230,118,0.3);color:var(--green);}
.earn-soon{background:rgba(255,215,0,0.08);border:1px solid rgba(255,215,0,0.3);color:var(--yellow);}
.earn-grp{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:8px 4px 3px;letter-spacing:1px;}
.ind-selector{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;}
.ind-btn{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 8px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--dim);transition:all 0.15s;}
.ind-btn:hover{border-color:var(--accent);color:var(--accent);}
.ind-btn.active{background:rgba(0,212,255,0.1);border-color:var(--accent);color:var(--accent);}
.ind-label{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);margin-bottom:5px;letter-spacing:1px;}
.pp-row{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:5px 8px;background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.2);border-radius:5px;margin-bottom:8px;}
.pp-label{color:var(--dim);font-size:10px;}
.pp-val{color:var(--accent);font-weight:600;}

.ind-loading{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);text-align:center;padding:8px 0;}


/* ── Indicator Analysis styles ── */
.ind-analysis{font-family:'IBM Plex Mono',monospace;font-size:11px;line-height:1.7;}
.ind-section{margin-bottom:10px;padding:8px 10px;background:var(--bg3);border-radius:7px;}
.ind-section-title{font-size:11px;font-weight:600;margin-bottom:6px;letter-spacing:0.5px;}
.ind-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;font-size:11px;}
.ind-label{color:var(--dim);}
.ind-val{font-weight:600;}
.ind-bull{color:var(--green);}.ind-bear{color:var(--red);}.ind-neut{color:var(--yellow);}
.ind-summary{background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.2);border-radius:7px;padding:10px;font-size:12px;line-height:1.7;color:var(--text2);margin-top:8px;}

/* ── Heatmap ── */
.heatmap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:4px;}
.heat-tile{border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;transition:opacity 0.15s;position:relative;overflow:hidden;}
.heat-tile:hover{opacity:0.85;}
.heat-ticker{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:#fff;}
.heat-chg{font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(255,255,255,0.85);margin-top:2px;}
.heat-price{font-family:'IBM Plex Mono',monospace;font-size:9px;color:rgba(255,255,255,0.55);margin-top:2px;}

/* ── Sort bar ── */
.sort-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
.sort-lbl{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);}
.sort-btn{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 9px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--dim);transition:all 0.15s;}
.sort-btn:hover{border-color:var(--accent);color:var(--accent);}
.sort-btn.active{background:rgba(0,212,255,0.1);border-color:var(--accent);color:var(--accent);}
.view-btn{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 9px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--dim);transition:all 0.15s;}
.view-btn.active{background:rgba(168,85,247,0.1);border-color:var(--purple);color:var(--purple);}
/* ── Pin button ── */
.pin-btn{width:22px;height:22px;border-radius:4px;border:1px solid var(--border);background:var(--bg4);color:var(--dim);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;line-height:1;padding:0;}
.pin-btn:hover{border-color:var(--yellow);color:var(--yellow);}
.pin-btn.pinned{border-color:rgba(255,215,0,0.6);background:rgba(255,215,0,0.12);color:var(--yellow);}
.card.pinned{border-top:2px solid rgba(255,215,0,0.5);}

#onboarding-overlay{display:none!important;}
#onboarding-overlay.hidden{display:none;}
.onboard-box{background:var(--bg2);border:1px solid rgba(0,212,255,0.3);border-radius:16px;padding:28px 24px;max-width:400px;width:100%;box-shadow:0 0 60px rgba(0,212,255,0.12),0 0 120px rgba(0,212,255,0.06);}
.onboard-logo{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:700;color:var(--accent);letter-spacing:3px;margin-bottom:6px;}
.onboard-sub{font-size:13px;color:var(--dim);margin-bottom:22px;line-height:1.5;}
.onboard-step{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text2);margin-bottom:14px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;line-height:1.8;}
.onboard-step a{color:var(--accent);text-decoration:none;}
.onboard-step a:hover{text-decoration:underline;}

.onboard-input{width:100%;background:var(--bg4);border:1px solid rgba(0,212,255,0.3);color:var(--text);padding:10px 14px;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:13px;outline:none;transition:border-color 0.2s;box-sizing:border-box;margin-bottom:10px;}
.onboard-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,212,255,0.1);}

function getRangePos(price, s1, r1){
  if(!s1||!r1||r1<=s1) return 50;
  const pos=(price-s1)/(r1-s1)*100;
  return Math.max(2,Math.min(98,pos));
}
function getRangeZone(price, s1, r1){
  if(!s1||!r1) return{cls:'mid',txt:'—',border:'var(--dim)'};
  const pos=(price-s1)/(r1-s1);
  // คำนวณ % ห่างจาก S1 และ R1 (แม่นยำกว่าใช้ position ratio)
  const pctFromS1=s1>0?((price-s1)/s1*100):999;
  const pctFromR1=r1>0?((r1-price)/r1*100):999;
  if(price<=s1)        return{cls:'red',   txt:'🔴 ต่ำกว่าแนวรับ', border:'var(--red)',   zone:'near-s', ztxt:'⚠ ต่ำกว่า S1'};

// OHLC real-time cache — refreshed every 15s cycle (aligned with fetchAll)
const ohlcCache={};
let _ohlcCycle=0;
function _nowCycle(){return Math.floor(Date.now()/15000);}

async function fetchOHLC(ticker){
  const cycle=_nowCycle();
  const cached=ohlcCache[ticker];
  if(cached&&cached._c===cycle) return cached;
  try{
    // ใช้ /quote — pc=prevClose (ราคาปิดเมื่อวาน) ใช้เป็น C สำหรับ Classic Pivot
    const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${FINNHUB_KEY}`,{mode:'cors'});
    if(!r.ok) return cached||null;
    const d=await r.json();
    if(!d||(!d.c&&!d.pc)) return cached||null;
    // ใช้ pc เป็น Close สำหรับ Pivot (ราคาปิดเมื่อวาน = ถูกต้องสำหรับ Classic Pivot)
    const C=d.pc>0?d.pc:(d.c>0?d.c:0);
    if(C<=0) return cached||null;
    const H=d.h>0?d.h:C, L=d.l>0?d.l:C, O=d.o>0?d.o:C;
    const tr=Math.max(H-L,Math.abs(H-C),Math.abs(L-C));
    const ohlc={H,L,C,O,prevC:C,atr:tr>0?tr:C*0.015,_c:cycle};
    ohlcCache[ticker]=ohlc;
    return ohlc;
  }catch{return cached||null;}
}
function calcClassic(H,L,C){
  const PP=(H+L+C)/3;
  return{pp:PP,s1:2*PP-H,s2:PP-(H-L),s3:PP-2*(H-L),r1:2*PP-L,r2:PP+(H-L),r3:PP+2*(H-L)};
}
function calcCamarilla(H,L,C){
  const r=H-L;
  return{pp:(H+L+C)/3,s1:C-r*1.1/12,s2:C-r*1.1/6,s3:C-r*1.1/4,r1:C+r*1.1/12,r2:C+r*1.1/6,r3:C+r*1.1/4};
}
function calcFibonacci(H,L,C){
  const PP=(H+L+C)/3,r=H-L;
  return{pp:PP,s1:PP-0.382*r,s2:PP-0.618*r,s3:PP-r,r1:PP+0.382*r,r2:PP+0.618*r,r3:PP+r};
}
function calcWoodie(H,L,C,O){
  const PP=(H+L+2*C)/4;
  return{pp:PP,s1:2*PP-H,s2:PP-(H-L),s3:L-2*(H-PP),r1:2*PP-L,r2:PP+(H-L),r3:H+2*(PP-L)};
}
function calcATR(p,atr){
  return{pp:p,s1:+(p-atr).toFixed(2),s2:+(p-1.5*atr).toFixed(2),s3:+(p-2*atr).toFixed(2),r1:+(p+atr).toFixed(2),r2:+(p+1.5*atr).toFixed(2),r3:+(p+2*atr).toFixed(2)};
}

async function setIndicator(t,mode,btn){
  document.querySelectorAll(`#indselector-${t} .ind-btn`).forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');

  const ohlc=await fetchOHLC(t);
  if(statusEl)statusEl.style.display='none';
  let levels;
  if(!ohlc){
    const sp=getS(s.p,t),rs=getR(s.p);
    levels={s1:sp.s1,s2:sp.s2,s3:sp.s3,r1:rs.r1,r2:rs.r2,r3:rs.r3,pp:null};
    if(ppRowEl)ppRowEl.style.display='none';
  } else {
    const {H,L,C,O,atr}=ohlc;
    if(mode==='classic') levels=calcClassic(H,L,C);
    else if(mode==='camarilla') levels=calcCamarilla(H,L,C);
    else if(mode==='fibonacci') levels=calcFibonacci(H,L,C);
    else if(mode==='woodie') levels=calcWoodie(H,L,C,O);
    else levels=calcATR(s.p,atr);
    if(ppRowEl)ppRowEl.style.display='flex';
    if(ppEl)ppEl.textContent='$'+fmt(levels.pp);
    if(atrBadgeEl)atrBadgeEl.innerHTML=mode==='atr'?`<span class="atr-badge">ATR $${fmt(atr)}</span>`:'';
  }
  ['s1','s2','s3','r1','r2','r3'].forEach(k=>{
    const el=document.getElementById(k+'-'+t);
    if(el&&levels[k]!=null)el.innerHTML=`<span class="level-tag">${k.toUpperCase()}</span>${fmt(levels[k])}`;
  });
  // sync sup0 fallback ให้ตรงกับ pivot จริง
  if(levels.s1>0) sup0[t]=levels.s1;
  updateRangeBar(t, s.p, levels.s1, levels.r1);
  // Bug fix #3: explicitly sync card-top badge after indicator recalc
  const zone=getRangeZone(s.p, levels.s1, levels.r1);
  const badge=document.getElementById('badge-'+t);
  if(badge){badge.textContent=zone.txt;badge.className='badge '+(zone.cls==='accent'?'green':zone.cls);}
  const card=document.getElementById('card-'+t);

  const stopEl=document.getElementById('stop-'+t);const tgtEl=document.getElementById('tgt-'+t);
  if(stopEl&&levels.s2)stopEl.value=levels.s2.toFixed(2);
  if(tgtEl&&levels.r2)tgtEl.value=levels.r2.toFixed(2);
  calcTrade(t);
}

// ── สร้าง mock sparkline จากราคาปัจจุบัน เมื่อ proxy ทุกตัวล้มเหลว ──
function _genMockCandles(ticker, currentPrice, days=60){
  const c=[],h=[],l=[],o=[],v=[],t=[];
  let p=currentPrice*(0.75+Math.random()*0.1); // เริ่มที่ ~75-85% ของราคาปัจจุบัน
  const now=Math.floor(Date.now()/1000);
  const DAY=86400;
  for(let i=days;i>=0;i--){
    const chg=(Math.random()-0.46)*0.025; // bias ขึ้นเล็กน้อย
    p=Math.max(p*(1+chg), currentPrice*0.5);
    const hi=p*(1+Math.random()*0.012);
    const lo=p*(1-Math.random()*0.012);
    c.push(+p.toFixed(2));
    h.push(+hi.toFixed(2));
    l.push(+lo.toFixed(2));
    o.push(+(p*(1+(Math.random()-0.5)*0.008)).toFixed(2));
    v.push(Math.floor(500000+Math.random()*3000000));
    t.push(now-i*DAY);
  }
  // ปรับจุดสุดท้ายให้ตรงกับราคาปัจจุบัน
  c[c.length-1]=currentPrice;
  return{c,h,l,o,v,t,_mock:true};
}

async function fetchCandles(ticker, days=60){
  if(candleCache[ticker]&&candleCache[ticker].ts>Date.now()-300000&&(candleCache[ticker].days||0)>=days) return candleCache[ticker].data;
  // ใช้ Yahoo Finance v8 chart API (ฟรี ไม่ต้องใช้ key)
  try{
    const range=days<=30?'1mo':days<=90?'3mo':days<=150?'6mo':days<=210?'1y':'2y';
    const yahooUrl=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=${range}`;
    const proxies=[
      `https://yahoo-proxy.datsakonping1994.workers.dev/?url=${encodeURIComponent(yahooUrl)}`,
      `https://corsproxy.io/?url=${encodeURIComponent(yahooUrl)}`,
      `https://api.allorigins.win/raw?url=${encodeURIComponent(yahooUrl)}`,
      `https://thingproxy.freeboard.io/fetch/${yahooUrl}`,
      `https://proxy.cors.sh/${yahooUrl}`,
      `https://cors-anywhere.herokuapp.com/${yahooUrl}`,
    ];
    let r=null;
    for(const p of proxies){
      try{
        const ctrl=new AbortController();
        const tid=setTimeout(()=>ctrl.abort(),5000);
        r=await fetch(p,{headers:{'x-cors-api-key':'temp_'+Date.now()},signal:ctrl.signal});
        clearTimeout(tid);
        if(r&&r.ok) break;
      }catch{r=null;}
    }
    if(r&&r.ok){
      const d=await r.json();
      const res=d?.chart?.result?.[0];
      if(res&&res.timestamp&&res.timestamp.length>=5){
        const q=res.indicators.quote[0];
        const n=res.timestamp.length;
        const c=[],h=[],l=[],o=[],v=[],t=[];
        for(let i=0;i<n;i++){
          if(q.close[i]==null) continue;
          c.push(q.close[i]);
          h.push(q.high[i]||q.close[i]);
          l.push(q.low[i]||q.close[i]);
          o.push(q.open[i]||q.close[i]);
          v.push(q.volume[i]||0);
          t.push(res.timestamp[i]);
        }
        if(c.length>=5){
          const data={c,h,l,o,v,t};
          candleCache[ticker]={data,ts:Date.now(),days};
          return data;
        }
      }
    }
  }catch(e){}
  // ── Fallback: ใช้ mock data แทนเพื่อให้กราฟแสดงผลได้ ──
  const s=stocks.find(x=>x.t===ticker);
  if(s&&s.p>0){
    const data=_genMockCandles(ticker,s.p,days);
    candleCache[ticker]={data,ts:Date.now()-240000,days}; // cache สั้นกว่า เพื่อ retry จริงเร็วขึ้น
    return data;
  }
  return null;
}

function fmtVol(v){

}

function drawSparkline(ticker, data, currentPrice){
  const canvas=document.getElementById('spark-'+ticker);
  if(!canvas) return;
  const wrap=document.getElementById('spark-wrap-'+ticker);
  const W=wrap.offsetWidth||canvas.parentElement.offsetWidth||240;
  const H=90;
  // Retina/HiDPI fix
  const dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);

  const prices=data.c.slice(-30);
  const vols=data.v.slice(-30);
  const n=prices.length;
  if(n<2) return;

  // ── Price scale area: กราฟอยู่ฝั่งซ้าย, scale อยู่ขวา 44px ──
  const SCALE_W=44;
  const CHART_W=W-SCALE_W;

  // ── ดึง S1/S2/R1/R2 จาก DOM ──
  function getLvl(id){
    const el=document.getElementById(id+'-'+ticker);
    if(!el) return null;
    // textContent มี "S1 92.35" — ดึงเฉพาะตัวเลขหลังสุด
    const parts=el.textContent.trim().split(/\s+/);
    const v=parseFloat(parts[parts.length-1]);
    return isNaN(v)||v<=0?null:v;
  }
  let s1=getLvl('s1'), s2=getLvl('s2');
  let r1=getLvl('r1'), r2=getLvl('r2');

  if(!s1){const p=currentPrice||prices[prices.length-1];s1=sup0[ticker]||(p*0.95);s2=+(s1*0.95).toFixed(2);}
  if(!r1){const p=currentPrice||prices[prices.length-1];r1=+(p*1.05).toFixed(2);r2=+(p*1.10).toFixed(2);}
  if(!s2) s2=+(s1*0.95).toFixed(2);
  if(!r2) r2=+(r1*1.05).toFixed(2);

  // ── Y range — ใช้แค่ราคาจริง ไม่รวม S2/R2 เพื่อให้กราฟขยับชัด ──
  const allPrices=[...prices].filter(Boolean);
  const rawMin=Math.min(...allPrices);
  const rawMax=Math.max(...allPrices);
  const pad=(rawMax-rawMin)*0.1||rawMin*0.02;
  const minP=rawMin-pad;
  const maxP=rawMax+pad;
  const range=maxP-minP||1;
  const PAD_T=6, PAD_B=14;
  const toY=p=>PAD_T+(1-(p-minP)/range)*(H-PAD_T-PAD_B);

  // ── Volume bars ──
  const maxVol=Math.max(...vols)||1;
  const barW=CHART_W/n;
  vols.forEach((v,i)=>{
    const h=Math.max(2,(v/maxVol)*10);
    const volColor=vols[i]>=(vols[i-1]||0)?'rgba(0,230,118,0.25)':'rgba(255,68,102,0.25)';
    ctx.fillStyle=volColor;
    ctx.fillRect(i*barW,H-PAD_B-h+2,barW-1,h);
  });

  // ── Price scale (right side) ──
  // แบ่ง 4 level ระหว่าง min-max
  const scaleSteps=4;
  ctx.save();
  ctx.font='bold 9px IBM Plex Mono,monospace';
  ctx.textAlign='right';
  for(let i=0;i<=scaleSteps;i++){
    const p=minP+(maxP-minP)*(i/scaleSteps);
    const y=toY(p);
    // เส้น grid จางๆ
    ctx.strokeStyle='rgba(255,255,255,0.07)';
    ctx.lineWidth=0.5;
    ctx.setLineDash([]);
    ctx.beginPath();
    ctx.moveTo(0,y);ctx.lineTo(CHART_W,y);
    ctx.stroke();
    // ตัวเลขราคา
    const label=p>=1000?p.toFixed(0):p>=100?p.toFixed(1):p.toFixed(2);
    ctx.fillStyle='rgba(190,210,230,0.9)';
    ctx.fillText(label, W-2, y+3);
  }
  ctx.restore();

  // ── เส้น separator ระหว่าง chart และ scale ──
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,0.08)';
  ctx.lineWidth=0.5;
  ctx.beginPath();
  ctx.moveTo(CHART_W,0);ctx.lineTo(CHART_W,H);
  ctx.stroke();
  ctx.restore();

  // ── วาดเส้นแนวรับ/ต้าน ──
  const usedLabelY=[];
  function drawLevel(price, color, label){
    if(!price||price<=0) return;
    const y=toY(price);
    if(y<PAD_T||y>H-PAD_B+2) return;
    const isPrimary=label==='S1'||label==='R1';
    // ── เส้นทึบ ──
    ctx.save();
    ctx.setLineDash([]);
    ctx.lineWidth=isPrimary?2.5:1.8;
    ctx.strokeStyle=color;
    ctx.globalAlpha=isPrimary?1:0.75;
    ctx.beginPath();
    ctx.moveTo(0,y);ctx.lineTo(CHART_W,y);
    ctx.stroke();
    ctx.restore();

    // ── Label กำกับชื่อ + ราคา ──
    ctx.save();
    ctx.setLineDash([]);
    ctx.globalAlpha=1;
    ctx.font='bold 10px IBM Plex Mono,monospace';
    ctx.textAlign='left';
    let labelY=y-2;
    if(labelY-10<PAD_T) labelY=y+12;
    for(const uy of usedLabelY){
      if(Math.abs(labelY-uy)<12) labelY=uy+12;
    }
    usedLabelY.push(labelY);

    const isRes=label.startsWith('R');
    const bgColor=isRes?'rgba(0,160,70,0.75)':'rgba(180,20,20,0.75)';
    const textColor='#fff';
    const priceStr=price>=1000?price.toFixed(0):price>=100?price.toFixed(1):price.toFixed(2);
    const fullLabel=`${label} ${priceStr}`;
    const lw=ctx.measureText(fullLabel).width+10;
    ctx.fillStyle=bgColor;
    ctx.beginPath();
    ctx.roundRect(3,labelY-11,lw,14,3);
    ctx.fill();
    ctx.fillStyle=textColor;
    ctx.fillText(fullLabel, 7, labelY);
    ctx.restore();
  }
  drawLevel(r2,'rgba(0,220,110,0.65)','R2');
  drawLevel(r1,'rgba(0,255,130,1)','R1');
  drawLevel(s1,'rgba(255,60,60,1)','S1');
  drawLevel(s2,'rgba(255,80,80,0.65)','S2');

  // ── เส้นราคา ──
  const pts=prices.map((p,i)=>({x:i/(n-1)*CHART_W, y:toY(p)}));
  const isUp=(prices[prices.length-1]||0)>=(prices[0]||0);

  // ── Gradient fill สวยแบบ reference ──
  const grad=ctx.createLinearGradient(0,0,0,H);
  if(isUp){
    grad.addColorStop(0,'rgba(0,255,140,0.7)');
    grad.addColorStop(0.5,'rgba(0,220,100,0.35)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
  } else {
    grad.addColorStop(0,'rgba(255,80,110,0.7)');
    grad.addColorStop(0.5,'rgba(220,50,80,0.35)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
  }
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.lineTo(pts[pts.length-1].x,H-PAD_B);
  ctx.lineTo(0,H-PAD_B);ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();

  // ── glow effect ──
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.strokeStyle=isUp?'rgba(0,255,140,0.45)':'rgba(255,80,110,0.45)';
  ctx.lineWidth=8;ctx.lineJoin='round';ctx.stroke();

  // ── เส้นกราฟหลัก ──
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.strokeStyle=isUp?'#00ff8c':'#ff5577';
  ctx.lineWidth=3;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();

  // จุดราคาปัจจุบัน + glow
  const last=pts[pts.length-1];
  ctx.beginPath();ctx.arc(last.x,last.y,9,0,Math.PI*2);
  ctx.fillStyle=isUp?'rgba(0,255,140,0.3)':'rgba(255,80,110,0.3)';ctx.fill();
  ctx.beginPath();ctx.arc(last.x,last.y,5,0,Math.PI*2);
  ctx.fillStyle=isUp?'#00ff8c':'#ff5577';ctx.fill();
  ctx.beginPath();ctx.arc(last.x,last.y,2.5,0,Math.PI*2);
  ctx.fillStyle='#fff';ctx.fill();

  // ── Current price label บน scale ──
  const cur=currentPrice||prices[prices.length-1];
  const curY=toY(cur);
  ctx.save();
  // เส้น dashed ราคาปัจจุบัน
  ctx.setLineDash([3,4]);
  ctx.lineWidth=1.2;
  ctx.strokeStyle=isUp?'rgba(0,255,140,0.5)':'rgba(255,80,110,0.5)';
  ctx.beginPath();
  ctx.moveTo(0,curY);ctx.lineTo(CHART_W,curY);
  ctx.stroke();
  // กล่องราคาปัจจุบันบน scale
  const curLabel=cur>=1000?cur.toFixed(0):cur>=100?cur.toFixed(1):cur.toFixed(2);
  ctx.font='bold 9px IBM Plex Mono,monospace';
  const lw2=ctx.measureText(curLabel).width+8;
  ctx.fillStyle=isUp?'rgba(0,255,140,0.95)':'rgba(255,80,110,0.95)';
  ctx.fillRect(CHART_W+1,curY-8,SCALE_W-3,14);
  ctx.fillStyle='#000';
  ctx.textAlign='center';
  ctx.fillText(curLabel,CHART_W+1+(SCALE_W-4)/2,curY+4);
  ctx.restore();
}

  const ratio=avgVol>0?todayVol/avgVol:1;

  const valEl=document.getElementById('vol-val-'+ticker);

function renderMA(ticker, data, currentPrice){
  const el=document.getElementById('ma-row-'+ticker);

    if(c.length<n) return null;

  };
  const mas=[{n:20,label:'MA20',color:'#ffd700'},{n:50,label:'MA50',color:'#00bcd4'}];
  el.innerHTML=mas.map(m=>{
    const v=maVal(m.n);

    const above=currentPrice>=v;

      ${m.label} $${fmt(v)}
      <span style="font-size:9px">${above?'▲':'▼'}</span>
    </span>`;
  }).join('');
}

// ── RSI (Wilder's, 14-period Daily) ─────────────────────────────────────────
function calcRSI(closes, period=14){
  if(!closes||closes.length<period+1) return null;
  // initial avg gain/loss
  let gains=0, losses=0;
  for(let i=1;i<=period;i++){
    const diff=closes[i]-closes[i-1];
    if(diff>=0) gains+=diff; else losses+=Math.abs(diff);
  }
  let avgGain=gains/period, avgLoss=losses/period;
  // Wilder's smoothing for remaining candles
  for(let i=period+1;i<closes.length;i++){
    const diff=closes[i]-closes[i-1];
    avgGain=(avgGain*(period-1)+(diff>=0?diff:0))/period;
    avgLoss=(avgLoss*(period-1)+(diff<0?Math.abs(diff):0))/period;
  }
  if(avgLoss===0) return 100;
  const rs=avgGain/avgLoss;
  return Math.round((100-(100/(1+rs)))*10)/10;
}

function updateRSICard(ticker, rsi){
  if(rsi===null) return;
  // update runtime rsiData cache
  rsiData[ticker]=rsi;
  const rc=rsi>=70?'#ff4466':rsi<=30?'#00e676':'#ffd700';
  const rt=rsi>=70?'Overbought':rsi<=30?'Oversold':'Neutral';
  const rtc=rsi>=70?'rsi-ob-tag':rsi<=30?'rsi-os-tag':'rsi-mid-tag';
  // find needle and val elements inside the tech tab
  const techPane=document.getElementById('tech-'+ticker);
  if(!techPane) return;
  const needle=techPane.querySelector('.rsi-needle');
  const val=techPane.querySelector('.rsi-val');
  const tag=techPane.querySelector('.rsi-tag');
  if(needle){needle.style.left=Math.min(100,rsi)+'%';needle.style.background=rc;}
  if(val){val.textContent=rsi;val.style.color=rc;}
  if(tag){tag.textContent=rt;tag.className='rsi-tag '+rtc;}
}

// Fix 2: Lazy load — ใช้ IntersectionObserver โหลดเฉพาะ card ที่มองเห็น
const _sparkObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(!entry.isIntersecting) return;
    const wrap=entry.target;
    const ticker=wrap.id.replace('spark-wrap-','');
    const s=stocks.find(x=>x.t===ticker);
    if(!s) return;
    // โหลดเฉพาะถ้ายังไม่มี cache
    if(!candleCache[ticker]){
      loadCardExtras(ticker, s.p);
    } else {
      drawSparkline(ticker, candleCache[ticker].data, s.p);
      renderVolume(ticker, candleCache[ticker].data);
      renderMA(ticker, candleCache[ticker].data, s.p);
    }
    _sparkObserver.unobserve(wrap);
  });
},{rootMargin:'200px', threshold:0.01});

async function loadAllExtras(){

  stocks.forEach(s=>{

    if(wrap) _sparkObserver.observe(wrap);
  });
}

const pinnedSet=new Set();

function togglePin(ticker){
  const card=document.getElementById('card-'+ticker);
  const btn=document.getElementById('pin-'+ticker);
  if(!card||!btn) return;
  if(pinnedSet.has(ticker)){
    pinnedSet.delete(ticker);
    card.classList.remove('pinned');
    card.dataset.pinned='0';
    btn.classList.remove('pinned');
    btn.title='ปักมุด';
  } else {
    pinnedSet.add(ticker);
    card.classList.add('pinned');
    card.dataset.pinned='1';
    btn.classList.add('pinned');
    btn.title='เอาออกจากมุด';
  }
  reorderPinned();
}

function reorderPinned(){
  const grid=document.getElementById('grid');
  const cards=[...grid.querySelectorAll('.card')];
  // แยก pinned vs unpinned รักษาลำดับเดิม
  const pinned=cards.filter(c=>c.dataset.pinned==='1');
  const rest=cards.filter(c=>c.dataset.pinned!=='1');
  [...pinned,...rest].forEach(c=>grid.appendChild(c));
}

let currentSort='chg', currentView='grid', sortAsc=false;

function parseMcap(str){
  if(!str) return 0;
  const m=parseFloat(str);
  if(str.includes('T')) return m*1e12;
  if(str.includes('B')) return m*1e9;
  if(str.includes('M')) return m*1e6;
  return m;
}

function sortGrid(mode, btn){
  // Fix 1: ถ้ากด sort ขณะที่ near filter ทำงานอยู่ ให้ reset filter กลับเป็น all ก่อน
  if(currentFilter==='near'){
    currentFilter='all';
    ['filterAllBtn','filterUpBtn','filterDnBtn','filterNearBtn'].forEach(id=>{
      const el=document.getElementById(id);
      if(el) el.style.outline='none';
    });
    const allBtn=document.getElementById('filterAllBtn');
    if(allBtn) allBtn.style.outline='1px solid currentColor';
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('hidden'));
  }
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(currentSort===mode) sortAsc=!sortAsc; else { currentSort=mode; sortAsc=false; }
  const grid=document.getElementById('grid');
  const cards=[...grid.querySelectorAll('.card')];
  cards.sort((a,b)=>{
    const ta=a.dataset.t, tb=b.dataset.t;
    const sa=stocks.find(x=>x.t===ta), sb=stocks.find(x=>x.t===tb);
    if(!sa||!sb) return 0;
    let va, vb;
    if(mode==='chg'){ va=sa.c; vb=sb.c; }
    else if(mode==='rsi'){ va=rsiData[ta]||50; vb=rsiData[tb]||50; }
    else if(mode==='mcap'){ va=parseMcap(sa.mktcap); vb=parseMcap(sb.mktcap); }
    else if(mode==='name'){ return sortAsc?(ta>tb?-1:1):(ta<tb?-1:1); }
    return sortAsc?va-vb:vb-va;
  });
  cards.forEach(c=>grid.appendChild(c));
  reorderPinned();
  if(currentView==='heat') renderHeatmap();
}

function setView(mode, btn){
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentView=mode;
  const grid=document.getElementById('grid');
  const heat=document.getElementById('heatmap');
  if(mode==='grid'){ grid.style.display=''; heat.style.display='none'; }
  else { grid.style.display='none'; heat.style.display='block'; renderHeatmap(); }
}

function getTileBg(chg){
  const maxAbs=Math.max(...stocks.map(s=>Math.abs(s.c)||0.01));
  const intensity=Math.min(1,Math.abs(chg)/maxAbs);
  if(chg>0){const g=Math.round(80+intensity*150);return`rgb(0,${g},60)`;}
  else if(chg<0){const r=Math.round(120+intensity*135);return`rgb(${r},20,40)`;}
  return'rgb(40,42,60)';
}

function renderHeatmap(){
  const heat=document.getElementById('heatmap');
  const tickerSector={};
  Object.entries(sectorMap).forEach(([sec,tickers])=>tickers.forEach(t=>{tickerSector[t]=sec;}));
  const groups={};
  Object.keys(sectorMap).forEach(s=>{groups[s]=[];});
  stocks.forEach(s=>{
    const sec=tickerSector[s.t]||'อื่นๆ';
    if(!groups[sec]) groups[sec]=[];
    groups[sec].push(s);
  });
  Object.values(groups).forEach(arr=>arr.sort((a,b)=>parseMcap(b.mktcap||'0')-parseMcap(a.mktcap||'0')));

  let html='';
  Object.entries(groups).forEach(([secName,arr])=>{
    if(!arr.length) return;
    const avg=arr.reduce((sum,s)=>sum+s.c,0)/arr.length;
    const avgColor=avg>0?'#00e676':avg<0?'#ff4466':'#888';
    const avgSign=avg>=0?'+':'';

    html+=`<div style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--bg3);border-radius:6px 6px 0 0;border:1px solid var(--border);border-bottom:none">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--text2)">${secName}</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:${avgColor}">${avgSign}${avg.toFixed(2)}%</span>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:3px;padding:6px;background:var(--bg2);border:1px solid var(--border);border-radius:0 0 6px 6px">`;

    arr.forEach(s=>{
      const bg=getTileBg(s.c);
      const mcap=parseMcap(s.mktcap||'0');
      const norm=Math.max(0,Math.min(1,(Math.log10(mcap||1e9)-9)/(Math.log10(5e12)-9)));
      const sz=Math.round(52+norm*100);
      const chgSign=s.c>=0?'+':'';
      const priceStr=s.p>0?'$'+s.p.toFixed(s.p<10?3:s.p<100?2:s.p<1000?1:0):'—';

      html+=`<div onclick="goCard('${s.t}')" title="${s.n}"
        style="background:${bg};width:${sz}px;height:${sz}px;border-radius:6px;
               display:flex;flex-direction:column;justify-content:center;align-items:center;
               cursor:pointer;overflow:hidden;flex-shrink:0;
               transition:filter .12s"
        onmouseover="this.style.filter='brightness(1.3)'"
        onmouseout="this.style.filter='brightness(1)'">
        <div style="font-family:'IBM Plex Mono',monospace;font-weight:700;color:#fff;font-size:${sz>=110?14:sz>=80?12:sz>=60?10:9}px;text-align:center;padding:0 2px;line-height:1.1">${s.t}</div>
        ${sz>=58?`<div style="font-family:'IBM Plex Mono',monospace;color:rgba(255,255,255,.85);font-size:${sz>=90?12:10}px;line-height:1.2">${chgSign}${s.c}%</div>`:''}
        ${sz>=80?`<div style="font-family:'IBM Plex Mono',monospace;color:rgba(255,255,255,.4);font-size:9px">${priceStr}</div>`:''}
      </div>`;
    });

    html+=`</div></div>`;
  });

  heat.innerHTML=html;
}

function switchTab(el,contentId){

function calcTrade(t){
  const s=stocks.find(x=>x.t===t);if(!s)return;
  const port=parseFloat(document.getElementById('port-'+t)?.value)||0;
  const riskPct=parseFloat(document.getElementById('risk-'+t)?.value)||0;
  const entry=parseFloat(document.getElementById('entry-'+t)?.value)||0;
  const stop=parseFloat(document.getElementById('stop-'+t)?.value)||0;
  const target=parseFloat(document.getElementById('tgt-'+t)?.value)||0;
  const rrEl=document.getElementById('rr-'+t);
  const sharesEl=document.getElementById('shares-'+t);
  const lossEl=document.getElementById('loss-'+t);
  const resultEl=document.getElementById('tresult-'+t);
  if(!port||!riskPct||!entry||!stop){if(resultEl)resultEl.textContent='กรอกข้อมูลให้ครบ';return;}
  const maxLoss=port*riskPct/100;
  const riskPerShare=Math.abs(entry-stop);
  if(riskPerShare===0)return;
  const shares=Math.floor(maxLoss/riskPerShare);
  const totalCost=shares*entry;
  const rr=target?+((target-entry)/(entry-stop)).toFixed(2):null;
  const pnlWin=target?(shares*(target-entry)).toFixed(0):null;
  if(rrEl){rrEl.textContent=rr?`${rr}:1`:'—';rrEl.style.color=rr>=2?'var(--green)':rr>=1?'var(--yellow)':'var(--red)';}
  if(sharesEl)sharesEl.textContent=shares.toLocaleString();
  if(lossEl)lossEl.textContent='$'+maxLoss.toFixed(0);
  if(resultEl){
    let txt=`📊 ซื้อ ${shares} หุ้น @ $${entry} = $${totalCost.toFixed(0)}\n`;
    txt+=`🛑 Stop @ $${stop} (เสียสูงสุด $${maxLoss.toFixed(0)})\n`;
    if(target)txt+=`🎯 Target @ $${target} (กำไร $${pnlWin})\n`;
    if(rr)txt+=`📐 R/R = ${rr}:1 ${rr>=2?'✅ ดี':rr>=1?'⚠️ พอรับได้':'❌ ไม่คุ้ม'}`;
    resultEl.textContent=txt;
  }
}

function _getLevels(t,p){
  function getLvlVal(id,fallback){
    const el=document.getElementById(id+'-'+t);
    if(!el) return fallback;
    const parts=el.textContent.trim().split(/\s+/);
    const v=parseFloat(parts[parts.length-1]);
    return isNaN(v)||v<=0?fallback:v;
  }
  const fb=getS(p,t), fr=getR(p);
  const s1=getLvlVal('s1',fb.s1), s2=getLvlVal('s2',fb.s2), s3=getLvlVal('s3',fb.s3);
  const r1=getLvlVal('r1',fr.r1), r2=getLvlVal('r2',fr.r2), r3=getLvlVal('r3',fr.r3);
  const hasPivot=!!(ohlcCache[t]||sup0[t]);
  return{s1,s2,s3,r1,r2,r3,hasPivot};
}

function playAlertSound(type){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    if(type==='s'){
      o.frequency.setValueAtTime(520,ctx.currentTime);
      o.frequency.setValueAtTime(380,ctx.currentTime+0.12);
    } else {
      o.frequency.setValueAtTime(660,ctx.currentTime);
      o.frequency.setValueAtTime(880,ctx.currentTime+0.12);
    }
    g.gain.setValueAtTime(0.18,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);
    o.start(ctx.currentTime);o.stop(ctx.currentTime+0.35);
  }catch(e){}
}

function checkZoneAlert(ticker, price, s1, r1){
  if(!zoneAlertReady) return;
  const lvl=_getLevels(ticker,price);
  const card=document.getElementById('card-'+ticker);
  if(!card)return;

  const levels=[
    {name:'S1',val:lvl.s1,type:'s'}, {name:'S2',val:lvl.s2,type:'s'}, {name:'S3',val:lvl.s3,type:'s'},
    {name:'R1',val:lvl.r1,type:'r'}, {name:'R2',val:lvl.r2,type:'r'}, {name:'R3',val:lvl.r3,type:'r'},
  ];

  for(const lv of levels){
    if(!lv.val||lv.val<=0) continue;
    const stateKey=ticker+'_'+lv.name;
    const prev=zoneAlertState[stateKey]||'above'; // 'above' | 'below' | 'hit'

    let cur;
    if(lv.type==='s') cur = price<=lv.val ? 'below' : 'above';
    else               cur = price>=lv.val ? 'above' : 'below';

    // แจ้งเตือนเมื่อราคาเพิ่งแตะหรือทะลุผ่านแนว (state เปลี่ยน)
    if(cur!==prev){
      zoneAlertState[stateKey]=cur;
      // แจ้งเฉพาะตอนเพิ่งแตะ/ทะลุ ไม่แจ้งตอนราคากลับออก
      const crossed=(lv.type==='s'&&cur==='below')||(lv.type==='r'&&cur==='above');
      if(crossed){
        playAlertSound(lv.type);
        showToast(ticker, lv.type, lv.name, price, lv.val);
      }
    }
  }

  // pulse animation บน card
  const pos=getRangePos(price,lvl.s1,lvl.r1);
  card.classList.remove('zone-alert-s','zone-alert-r');
  // Bug fix #5: pulse red if below S1 OR near S1 (pos<=15), pulse green if near R1 (pos>=85)
  if(price<=lvl.s1||pos<=15) card.classList.add('zone-alert-s');
  else if(pos>=85) card.classList.add('zone-alert-r');
}

function updateCard(s){

    if(old&&s.p>old){pe.style.color='var(--green)';setTimeout(()=>pe.style.color='',600);}
    else if(old&&s.p<old){pe.style.color='var(--red)';setTimeout(()=>pe.style.color='',600);}
  }
  const ce=document.getElementById('chg-'+s.t);if(ce){ce.textContent=(s.c>0?'+':'')+s.c+'%';ce.className='chg '+cc;}
  // always use indicator levels (Classic Pivot by default, or whatever is selected)
  const {s1,r1}=_getLevels(s.t,s.p);
  updateRangeBar(s.t,s.p,s1,r1);
  card.dataset.dir=s.c>=0?'up':'dn';
  const pos=getRangePos(s.p,s1,r1);

  checkZoneAlert(s.t,s.p,s1,r1);

function updateAlerts(){
  if(!_pivotReady) return;
  const nearS=[],nearR=[];
  stocks.forEach(s=>{
    if(s.p<=0) return;
    const {s1,r1,hasPivot}=_getLevels(s.t,s.p);
    if(!hasPivot||!s1||!r1||r1<=s1) return;
    const pos=(s.p-s1)/(r1-s1);
    if(s.p<=s1||pos<=0.35) nearS.push(s);
    else if(pos>=0.65) nearR.push(s);
  });
  // sort S: ใกล้ที่สุดก่อน (pctS น้อยสุด)
  nearS.sort((a,b)=>{
    const la=_getLevels(a.t,a.p),lb=_getLevels(b.t,b.p);
    return ((a.p-la.s1)/la.s1)-((b.p-lb.s1)/lb.s1);
  });
  // sort R: ใกล้ที่สุดก่อน (pctR น้อยสุด)
  nearR.sort((a,b)=>{
    const la=_getLevels(a.t,a.p),lb=_getLevels(b.t,b.p);
    return ((la.r1-a.p)/la.r1)-((lb.r1-b.p)/lb.r1);
  });
  const total=nearS.length+nearR.length;
  document.getElementById('nearCnt').textContent=total;
  const panel=document.getElementById('alertPanel');
  if(!total){panel.classList.remove('show');return;}
  panel.classList.add('show');
  // S section
  const listS=document.getElementById('alertListS');
  const sLabel=document.getElementById('alertSLabel');
  if(nearS.length){
    sLabel.style.display='block';
    listS.style.display='flex';
    listS.innerHTML=nearS.map(s=>{
      const {s1}=_getLevels(s.t,s.p);
      const pct=s1>0?((s.p-s1)/s1*100).toFixed(1):0;
      return`<div class="alert-chip crit" onclick="goCard('${s.t}')">🔴 ${s.t} <span style="opacity:0.7">${pct}%</span></div>`;
    }).join('');
  } else {
    sLabel.style.display='none';
    listS.style.display='none';
    listS.innerHTML='';
  }
  // R section
  const listR=document.getElementById('alertListR');
  const rLabel=document.getElementById('alertRLabel');
  if(nearR.length){
    rLabel.style.display='block';
    listR.style.display='flex';
    listR.innerHTML=nearR.map(s=>{
      const {r1}=_getLevels(s.t,s.p);
      const pct=r1>0?((r1-s.p)/r1*100).toFixed(1):0;
      return`<div class="alert-chip warn" style="background:rgba(0,230,118,0.1);border-color:rgba(0,230,118,0.3);color:var(--green)" onclick="goCard('${s.t}')">🟢 ${s.t} <span style="opacity:0.7">${pct}%</span></div>`;
    }).join('');
  } else {
    rLabel.style.display='none';
    listR.style.display='none';
    listR.innerHTML='';
  }
}

function setFilter(f){
  currentFilter=f;
  // เคลียร์ search box เมื่อกด "ทั้งหมด"
  if(f==='all'){
    const sb=document.getElementById('searchBox');
    if(sb) sb.value='';
  }
  ['filterAllBtn','filterUpBtn','filterDnBtn','filterNearBtn'].forEach(id=>{

  });
  const map={all:'filterAllBtn',up:'filterUpBtn',dn:'filterDnBtn',near:'filterNearBtn'};
  const activeBtn=document.getElementById(map[f]);

function filterCards(){
  const q=document.getElementById('searchBox').value.toUpperCase().trim();
  const grid=document.getElementById('grid');
  const cards=[...document.querySelectorAll('.card')];

  cards.forEach(c=>{
    const match=!q||c.dataset.t.includes(q)||c.dataset.n?.includes(q);
    const ok=currentFilter==='all'||(currentFilter==='up'&&c.dataset.dir==='up')||(currentFilter==='dn'&&c.dataset.dir==='dn')||(currentFilter==='near'&&c.dataset.near==='yes');
    c.classList.toggle('hidden',!match||!ok);
  });

  // Fix 1+2: เมื่อกรอง "ใกล้แนวรับ" ให้เรียงการ์ดจากใกล้ S1/R1 มากสุดขึ้นก่อน แล้ว reorderPinned
  if(currentFilter==='near'){
    const sorted=cards.slice().sort((a,b)=>{
      const hidA=a.classList.contains('hidden'), hidB=b.classList.contains('hidden');
      if(hidA&&!hidB) return 1;
      if(!hidA&&hidB) return -1;
      const ta=a.dataset.t, tb=b.dataset.t;
      const sa=stocks.find(x=>x.t===ta), sb=stocks.find(x=>x.t===tb);
      if(!sa||!sb) return 0;
      const la=_getLevels(ta,sa.p), lb=_getLevels(tb,sb.p);
      const posA=getRangePos(sa.p,la.s1,la.r1);
      const posB=getRangePos(sb.p,lb.s1,lb.r1);
      const distA=posA<=50?posA:100-posA;
      const distB=posB<=50?posB:100-posB;
      return distA-distB;
    });
    sorted.forEach(c=>grid.appendChild(c));
    reorderPinned(); // Fix 2: pinned cards ต้องอยู่บนสุดแม้ตอน near filter
  }
}

function countdown(d){
  const m={'ม.ค.':0,'ก.พ.':1,'มี.ค.':2,'เม.ย.':3,'พ.ค.':4,'มิ.ย.':5,'ก.ค.':6,'ส.ค.':7,'ก.ย.':8,'ต.ค.':9,'พ.ย.':10,'ธ.ค.':11};
  const p=d.split(' ');if(p.length<3)return'';
  const day=parseInt(p[0]);
  // Bug fix: if day is NaN (e.g. "ปลาย"), can't compute exact countdown
  if(isNaN(day)||!(p[1] in m)) return'';
  const t=new Date(parseInt(p[2]),m[p[1]],day,20,30,0);
  const diff=t-new Date();if(diff<0)return'ผ่านไปแล้ว';
  const days=Math.floor(diff/86400000),hrs=Math.floor((diff%86400000)/3600000);
  return days>0?`อีก ${days}วัน ${hrs}ชม.`:`อีก ${hrs}ชม.`;
}

// ── คำนวณ indicators และสรุปเป็น context string ──
async function buildAIContext(t) {
  const s = stocks.find(x => x.t === t); if (!s) return null;
  const data = candleCache[t]?.data?.c?.length >= 200 ? candleCache[t].data : await fetchCandles(t, 260);
  const closes = data?.c || [], highs = data?.h || [], lows = data?.l || [], vols = data?.v || [];
  const price = s.p;

  const ema = (arr, n) => {
    if (arr.length < n) return null;
    const k = 2 / (n + 1);
    let e = arr.slice(0, n).reduce((a, b) => a + b, 0) / n;
    for (let i = n; i < arr.length; i++) e = arr[i] * k + e * (1 - k);
    return +e.toFixed(3);
  };
  const sma = (arr, n) => arr.length < n ? null : +(arr.slice(-n).reduce((a, b) => a + b, 0) / n).toFixed(3);

  const rsi = rsiData[t] || calcRSI(closes) || null;
  const ema20 = ema(closes, 20), ema50 = ema(closes, 50), ema200 = ema(closes, 200);
  const macd12 = ema(closes, 12), macd26 = ema(closes, 26);
  const macdLine = macd12 && macd26 ? +(macd12 - macd26).toFixed(3) : null;
  let macdSignal = null;
  if (closes.length >= 35) {
    const ms = [];
    for (let i = 25; i < closes.length; i++) {
      const e12 = ema(closes.slice(0, i + 1), 12), e26 = ema(closes.slice(0, i + 1), 26);
      if (e12 && e26) ms.push(e12 - e26);
    }
    if (ms.length >= 9) macdSignal = +ema(ms, 9).toFixed(3);
  }
  const bbMid = sma(closes, 20);
  let bbUpper = null, bbLower = null;
  if (bbMid && closes.length >= 20) {
    const std = Math.sqrt(closes.slice(-20).reduce((a, b) => a + (b - bbMid) ** 2, 0) / 20);
    bbUpper = +(bbMid + 2 * std).toFixed(2);
    bbLower = +(bbMid - 2 * std).toFixed(2);
  }
  let stochK = null;
  if (closes.length >= 14) {
    const h14 = Math.max(...highs.slice(-14)), l14 = Math.min(...lows.slice(-14));
    stochK = h14 !== l14 ? +((price - l14) / (h14 - l14) * 100).toFixed(1) : 50;
  }
  let atr = null;
  if (closes.length >= 14) {
    const trs = [];
    for (let i = 1; i < Math.min(15, closes.length); i++)
      trs.push(Math.max(highs[i] - lows[i], Math.abs(highs[i] - closes[i - 1]), Math.abs(lows[i] - closes[i - 1])));
    atr = +(trs.reduce((a, b) => a + b, 0) / trs.length).toFixed(2);
  }
  const volToday = vols[vols.length - 1] || 0;
  const volAvg = vols.slice(-20).reduce((a, b) => a + b, 0) / Math.min(20, vols.length);
  const volRatio = volAvg > 0 ? +(volToday / volAvg).toFixed(2) : 1;
  let obv = 0;
  for (let i = 1; i < closes.length; i++) {
    if (closes[i] > closes[i - 1]) obv += vols[i];
    else if (closes[i] < closes[i - 1]) obv -= vols[i];
  }
  const obvTrend = closes.length >= 5 ? (closes[closes.length - 1] > closes[closes.length - 5] ? 'เพิ่มขึ้น' : 'ลดลง') : 'N/A';
  const lvl = _getLevels(t, price);
  // ข่าวล่าสุด
  const newsItems = liveNewsCache[t]?.items?.slice(0, 3) || newsData[t]?.slice(0, 3) || [];
  const newsStr = newsItems.length ? newsItems.map(n => '- ' + n.h).join('\n') : 'ไม่มีข่าวล่าสุด';
  // สรุป indicator chips
  const chips = [
    { label: `RSI ${rsi || '—'}`, cls: rsi >= 70 ? 'bear' : rsi <= 30 ? 'bull' : 'neut' },
    { label: `EMA20 ${ema20 && price > ema20 ? '▲' : '▼'}`, cls: ema20 && price > ema20 ? 'bull' : 'bear' },
    { label: `EMA50 ${ema50 && price > ema50 ? '▲' : '▼'}`, cls: ema50 && price > ema50 ? 'bull' : 'bear' },
    { label: `EMA200 ${ema200 && price > ema200 ? '▲' : '▼'}`, cls: ema200 && price > ema200 ? 'bull' : 'bear' },
    { label: `MACD ${macdLine && macdSignal ? (macdLine > macdSignal ? '▲' : '▼') : '—'}`, cls: macdLine && macdSignal ? (macdLine > macdSignal ? 'bull' : 'bear') : 'neut' },
    { label: `BB ${bbUpper && price >= bbUpper ? 'บน' : bbLower && price <= bbLower ? 'ล่าง' : 'กลาง'}`, cls: bbUpper && price >= bbUpper ? 'bear' : bbLower && price <= bbLower ? 'bull' : 'neut' },
    { label: `VOL ${volRatio}x`, cls: volRatio >= 1.5 ? 'bull' : volRatio <= 0.7 ? 'bear' : 'neut' },
    { label: `Stoch ${stochK || '—'}`, cls: stochK >= 80 ? 'bear' : stochK <= 20 ? 'bull' : 'neut' },
  ];
  const chipEl = document.getElementById('ai-chips-' + t);
  if (chipEl) chipEl.innerHTML = chips.map(c => `<span class="ai-ind-chip ${c.cls}">${c.label}</span>`).join('');

  return {
    systemPrompt: `คุณคือ AI นักวิเคราะห์หุ้นผู้เชี่ยวชาญ วิเคราะห์ข้อมูลหุ้นเป็นภาษาไทย กระชับ ตรงประเด็น ใช้ภาษาเข้าใจง่าย ระบุ จุดเด่น ความเสี่ยง และแนวทางการลงทุน เสมอ ลงท้ายด้วยข้อความว่า "⚠️ ข้อมูลเพื่อการศึกษาเท่านั้น ไม่ใช่คำแนะนำการลงทุน"`,
    userPrompt: `วิเคราะห์หุ้น ${t} (${s.n}) ให้ละเอียด:

💰 ราคาปัจจุบัน: $${price} (${s.c > 0 ? '+' : ''}${s.c}%)
📊 Fundamental: PE=${s.pe || 'N/A'}, Mkt Cap=${s.mktcap || 'N/A'}, Rev Growth=${s.rev || 'N/A'}

📈 Technical Indicators:
- RSI(14): ${rsi || 'N/A'} ${rsi >= 70 ? '(Overbought)' : rsi <= 30 ? '(Oversold)' : '(Normal)'}
- EMA20: ${ema20 || 'N/A'} | EMA50: ${ema50 || 'N/A'} | EMA200: ${ema200 || 'N/A'}
- ราคาเทียบ EMA: ${ema20 ? (price > ema20 ? 'เหนือ' : 'ต่ำกว่า') : 'N/A'} EMA20, ${ema50 ? (price > ema50 ? 'เหนือ' : 'ต่ำกว่า') : 'N/A'} EMA50, ${ema200 ? (price > ema200 ? 'เหนือ' : 'ต่ำกว่า') : 'N/A'} EMA200
- MACD Line: ${macdLine || 'N/A'} | Signal: ${macdSignal || 'N/A'} → ${macdLine && macdSignal ? (macdLine > macdSignal ? 'Bullish Crossover' : 'Bearish Crossover') : 'N/A'}
- Bollinger Bands: Upper=${bbUpper || 'N/A'}, Mid=${bbMid || 'N/A'}, Lower=${bbLower || 'N/A'}
- Stochastic %K: ${stochK || 'N/A'}
- ATR(14): ${atr || 'N/A'}
- Volume ratio (vs avg20): ${volRatio}x ${volRatio >= 1.5 ? '(สูงผิดปกติ)' : volRatio <= 0.7 ? '(ต่ำผิดปกติ)' : '(ปกติ)'}
- OBV Trend: ${obvTrend}

🎯 Pivot Levels:
- S1: ${lvl.s1 ? '$' + lvl.s1.toFixed(2) : 'N/A'} | S2: ${lvl.s2 ? '$' + lvl.s2.toFixed(2) : 'N/A'}
- R1: ${lvl.r1 ? '$' + lvl.r1.toFixed(2) : 'N/A'} | R2: ${lvl.r2 ? '$' + lvl.r2.toFixed(2) : 'N/A'}

📰 ข่าวล่าสุด:
${newsStr}

กรุณาวิเคราะห์: 1) แนวโน้มระยะสั้น/กลาง 2) จุดเข้า/ออกที่น่าสนใจ 3) ความเสี่ยงสำคัญ 4) สรุปภาพรวม`,
    chips
  };
}

// ── streaming call to Claude API ──
async function streamClaude(systemPrompt, messages, onChunk, onDone) {
  const body = JSON.stringify({
    model: 'claude-sonnet-4-5',
    max_tokens: 1024,
    system: systemPrompt,
    messages
  });
  const headers = {
    'Content-Type': 'application/json'
  };

  // ── ตรวจ ReadableStream support (iOS Safari เก่าไม่รองรับ) ──
  const supportsStream = typeof ReadableStream !== 'undefined' && typeof TextDecoder !== 'undefined';

  if (supportsStream) {
    // ── Streaming mode ──
    try {
      const res = await fetch('https://anthropic-proxy.datsakonping1994.workers.dev', {
        method: 'POST', headers,
        body: JSON.stringify({ ...JSON.parse(body), stream: true })
      });
      if (!res.ok) {
        const errBody = await res.text().catch(() => '');
        onDone(null, `API error ${res.status}: ${errBody.slice(0, 100)}`);
        return;
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = '', buf = '';
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop(); // เก็บบรรทัดที่ยังไม่สมบูรณ์
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (!data || data === '[DONE]') continue;
          try {
            const evt = JSON.parse(data);
            if (evt.type === 'error') {
              onDone(null, evt.error?.message || 'Stream error');
              return;
            }
            if (evt.type === 'content_block_delta' && evt.delta?.type === 'text_delta') {
              full += evt.delta.text;
              onChunk(full);
            }
          } catch {}
        }
      }
      if (!full) {
        // ลอง non-streaming fallback
        await _claudeFallback(headers, body, onChunk, onDone);
      } else {
        onDone(full, null);
      }
    } catch (e) {
      // Stream failed — fallback
      await _claudeFallback(headers, body, onChunk, onDone);
    }
  } else {
    // ── Non-streaming fallback (iOS Safari) ──
    await _claudeFallback(headers, body, onChunk, onDone);
  }
}

async function _claudeFallback(headers, body, onChunk, onDone) {
  try {
    onChunk('⏳ กำลังวิเคราะห์...');
    const res = await fetch('https://anthropic-proxy.datsakonping1994.workers.dev', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body
    });
    if (!res.ok) {
      const errBody = await res.text().catch(() => '');
      onDone(null, `API error ${res.status}: ${errBody.slice(0, 100)}`);
      return;
    }
    const d = await res.json();
    if (d.type === 'error') { onDone(null, d.error?.message || 'API error'); return; }
    const text = d?.content?.filter(b => b.type === 'text').map(b => b.text).join('') || '';
    if (!text) { onDone(null, 'ไม่ได้รับข้อมูลจาก AI'); return; }
    onDone(text, null);
  } catch (e) {
    onDone(null, e.message);
  }
}

// REAL-TIME PRICE — Finnhub WebSocket
// ═══════════════════════════════════════════════════════
let ws=null, wsReady=false, isLive=false, wsPingInterval=null;
let newsRefreshTimer=null; // declared separately so wsDisconnect can clearInterval safely
const wsQueue=new Set();
const liveCache={}; // {ticker:{price,prevPrice,change}}
// Bug fix: module-level tick counter (avoids DOM read/write race)
let _wsTickCount=0;
// Bug fix: throttle setIndicator per ticker (no more HTTP call every WS tick)
const _indThrottle={};

// ── FIX 2: WS subscribe แค่ 50 ตัวแรก (free plan limit) ──
// หุ้นที่เกิน 50 จะได้ราคาจาก HTTP poll แทน
const WS_MAX_SUBS=50;
let _wsReconnectTimer=null;
let _wsReconnectCount=0;

function wsConnect(){
  if(ws&&ws.readyState<=1) return;
  clearTimeout(_wsReconnectTimer);
  ws=new WebSocket(`wss://ws.finnhub.io?token=${FINNHUB_KEY}`);
  ws.onopen=()=>{
    wsReady=true;
    _wsReconnectCount=0;
    document.getElementById('statusbar').innerHTML='🟢 WebSocket เชื่อมต่อแล้ว · รอราคา...';
    // subscribe เฉพาะ 50 ตัวแรก (free plan limit)
    stocks.slice(0,WS_MAX_SUBS).forEach(s=>{
      ws.send(JSON.stringify({type:'subscribe',symbol:s.t}));
    });
    // ping every 20s to keep alive
    wsPingInterval=setInterval(()=>{if(ws.readyState===1) ws.send(JSON.stringify({type:'ping'}));},20000);
  };
  ws.onmessage=e=>{
    try{
      const msg=JSON.parse(e.data);
      if(msg.type!=='trade'||!msg.data) return;
      msg.data.forEach(trade=>{
        const t=trade.s, price=trade.p;
        if(!price||price<=0) return;
        const s=stocks.find(x=>x.t===t);
        if(!s) return;
        const prev=liveCache[t]?.price||s.p||price;
        // Bug fix #1: use prevClose from ohlcCache for accurate daily % change
        const prevClose=ohlcCache[t]?.prevC||s.p||price;
        const chg=prevClose>0?+((price-prevClose)/prevClose*100).toFixed(2):0;
        // flash detection (tick direction)
        const dir=price>prev?'up':price<prev?'dn':'flat';
        liveCache[t]={price,prevPrice:prev,dir};
        s.p=price; s.c=chg;
        // update OHLC cache with new price
        const cachedOhlc=ohlcCache[t];
        if(cachedOhlc){
          cachedOhlc.C=price;
          if(price>cachedOhlc.H) cachedOhlc.H=price;
          if(price<cachedOhlc.L) cachedOhlc.L=price;
          cachedOhlc._c=_nowCycle();
        }
        updateCard(s);
        // Bug fix: throttle setIndicator — max once per 15s per ticker to avoid API spam
        if(tickerIndicator[t]){
          const now15=Math.floor(Date.now()/15000);
          if(_indThrottle[t]!==now15){
            _indThrottle[t]=now15;
            const btn=document.querySelector(`#indselector-${t} .ind-btn.active`);
            if(btn) setIndicator(t,tickerIndicator[t],btn);
          }
        }
        // redraw sparkline with updated price + refresh MA
        const cachedCandle=candleCache[t];
        if(cachedCandle){drawSparkline(t,cachedCandle.data,price);renderMA(t,cachedCandle.data,price);}
        // Bug fix: use module-level counter, update statusbar without recreating wsTickCnt element
        _wsTickCount++;
        // อัปเดต tick counter โดยไม่ rewrite innerHTML ทั้งหมด
        const tickEl=document.getElementById('wsTickCnt');
        if(tickEl){
          tickEl.textContent=_wsTickCount;
        } else {
          // ครั้งแรก — สร้าง statusbar structure ครั้งเดียว
          document.getElementById('statusbar').innerHTML=`🟢 WebSocket Live · <span id="wsTickCnt" style="color:var(--accent)">${_wsTickCount}</span> ticks · <span id="wsTime">${new Date().toLocaleTimeString('th-TH')}</span>`;
        }
        // อัปเดตเวลาแยก (ไม่สร้าง DOM ใหม่)
        const timeEl=document.getElementById('wsTime');
        if(timeEl&&_wsTickCount%10===0) timeEl.textContent=new Date().toLocaleTimeString('th-TH');
      });
      // refresh up/dn counts
      document.getElementById('upCnt').textContent=stocks.filter(s=>s.c>=0).length;
      document.getElementById('dnCnt').textContent=stocks.filter(s=>s.c<0).length;
    }catch{}
  };
  ws.onerror=()=>{
    wsReady=false;
    // HTTP poll timer already running — no duplicate call needed
  };
  ws.onclose=()=>{
    wsReady=false;
    clearInterval(wsPingInterval);
    if(isLive){
      // ── FIX 3: Exponential backoff reconnect (1s→2s→4s→...→max 30s) ──
      _wsReconnectCount++;
      const delay=Math.min(1000*Math.pow(2,_wsReconnectCount-1), 30000);
      const st=document.getElementById('statusbar');
      st.innerHTML=`🔴 WebSocket หลุด · เชื่อมใหม่ใน ${(delay/1000).toFixed(0)}s... (ครั้งที่ ${_wsReconnectCount})`;
      _wsReconnectTimer=setTimeout(()=>{
        if(isLive&&(!ws||ws.readyState>1)) wsConnect();
      }, delay);
    }
  };
}

function wsDisconnect(){
  clearInterval(wsPingInterval);
  // Bug fix: also stop news auto-refresh timer when going offline
  clearInterval(newsRefreshTimer);
  if(ws){
    stocks.slice(0,WS_MAX_SUBS).forEach(s=>{if(ws.readyState===1) ws.send(JSON.stringify({type:'unsubscribe',symbol:s.t}));});
    ws.close();
  }
  ws=null; wsReady=false;
}

// Fallback HTTP poll (used when WebSocket fails or market closed)
let httpPollTimer=null; // setInterval handle
let _pollRunning=false;
async function fallbackPoll(){
  if(!isLive||_pollRunning) return;
  _pollRunning=true;
  try{
  const st=document.getElementById('statusbar');
  let ok=0;
  // ── FIX 1: batch 8 + delay 400ms → ครบ 52 ตัวใน ~3s (จากเดิม 16s) ──
  // rate limit safe: 7 batches × 400ms = 2.8s, ~52 calls/round << 60/min
  const BATCH=8, DELAY=400;
  for(let i=0;i<stocks.length;i+=BATCH){
    if(!isLive) break;
    const batch=stocks.slice(i,i+BATCH);
    await Promise.all(batch.map(async s=>{
      const d=await fetchOne(s.t);
      if(d){
        s.p=d.price;s.c=d.change;ok++;
        updateCard(s);
        // อัปเดต indicator เฉพาะตัวที่ WS ไม่ได้ tick (ประหยัด API call)
        if(tickerIndicator[s.t]&&!wsReady){
          const btn=document.querySelector(`#indselector-${s.t} .ind-btn.active`);
          if(btn) setIndicator(s.t,tickerIndicator[s.t],btn);
        }
      }
    }));
    st.innerHTML=`🟡 HTTP · กำลังดึง ${Math.min(i+BATCH,stocks.length)}/${stocks.length} ตัว...`;
    await new Promise(r=>setTimeout(r,DELAY));
  }
  const now=new Date().toLocaleTimeString('th-TH');
  document.getElementById('updateTime').textContent=now;
  st.innerHTML=`🟡 HTTP · อัปเดต ${ok} ตัว · ${now}`;
  document.getElementById('upCnt').textContent=stocks.filter(s=>s.c>=0).length;
  document.getElementById('dnCnt').textContent=stocks.filter(s=>s.c<0).length;
  }finally{_pollRunning=false;}
}

async function fetchOne(ticker){
  try{
    const r=await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${FINNHUB_KEY}`,{mode:'cors'});
    if(!r.ok)return null;
    const d=await r.json();
    // ใช้ราคาปิดล่าสุด (pc) ถ้า c=0 (ตลาดปิดหรือยังไม่มี tick)
    const price=d.c>0?d.c:(d.pc>0?d.pc:0);
    if(!d||price<=0) return null;
    d.c=price;
    const cycle=_nowCycle();
    const H=d.h>0?d.h:d.c,L=d.l>0?d.l:d.c,C=d.c,O=d.o>0?d.o:d.c,prevC=d.pc>0?d.pc:d.c;
    const tr=Math.max(H-L,Math.abs(H-prevC),Math.abs(L-prevC));
    ohlcCache[ticker]={H,L,C,O,prevC,atr:tr>0?tr:C*0.015,_c:cycle};
    return{price:d.c,change:d.dp?+d.dp.toFixed(2):0};
  }catch{return null;}
}

async function toggleLive(){

    document.getElementById('statusbar').innerHTML='🔄 กำลังเชื่อมต่อ...';

    // WS = real-time สำหรับ 50 ตัวแรก
    // HTTP = fallback + อัปเดต 2 ตัวที่เกิน limit + ราคา pre-market/after-hours
    try{ wsConnect(); }catch(e){}

    httpPollTimer=setInterval(async()=>{ if(isLive) await fallbackPoll(); },15000);
  }
}

}

// ── Claude AI Translation (แม่นยำกว่าสำหรับข่าวการเงิน) ──
const _translateCache={};
const _TRANSLATE_CACHE_MAX=200;
function _addTranslateCache(key,val){
  if(Object.keys(_translateCache).length>=_TRANSLATE_CACHE_MAX){
    // ลบ entry เก่าสุด 50 ชิ้น
    Object.keys(_translateCache).slice(0,50).forEach(k=>delete _translateCache[k]);
  }
  _translateCache[key]=val;
}
async function translateTH(text){
  if(!text) return text;
  const cacheKey=text.slice(0,80);
  if(_translateCache[cacheKey]) return _translateCache[cacheKey];
  try{
    const r=await fetch('https://anthropic-proxy.datsakonping1994.workers.dev',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens:1000,
        messages:[{role:'user',content:`แปลข้อความต่อไปนี้เป็นภาษาไทยให้เป็นธรรมชาติ สำหรับบริบทข่าวการเงินและหุ้น ตอบเฉพาะคำแปลเท่านั้น ไม่ต้องมีคำอธิบายเพิ่มเติม:\n\n${text.slice(0,500)}`}]
      })
    });
    if(!r.ok) return text;
    const d=await r.json();
    const translated=d?.content?.[0]?.text?.trim()||text;
    _addTranslateCache(cacheKey,translated);
    return translated;
  }catch{return text;}
}

async function translateNewsItems(items){
  // Batch translate ด้วย Claude AI — แปลทุก item ในครั้งเดียว แม่นยำกว่า
  try{
    const toTranslate=items.map(n=>({h:n.h||'',x:(n.x||'').slice(0,300)}));
    const r=await fetch('https://anthropic-proxy.datsakonping1994.workers.dev',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens:4000,
        messages:[{role:'user',content:`แปลข้อความข่าวการเงินต่อไปนี้เป็นภาษาไทยให้เป็นธรรมชาติ ตอบเป็น JSON array ของ object เท่านั้น ห้ามมี markdown หรือคำอธิบาย รูปแบบ: [{"h":"หัวข้อแปล","x":"สรุปแปล"},...] input: ${JSON.stringify(toTranslate)}`}]
      })
    });
    if(r.ok){
      const d=await r.json();
      const raw=d?.content?.[0]?.text?.trim()||'';
      const clean=raw.replace(/```json|```/g,'').trim();
      const arr=JSON.parse(clean);
      if(Array.isArray(arr)&&arr.length===items.length){
        return items.map((n,i)=>({...n,h:arr[i]?.h||n.h,x:arr[i]?.x||n.x}));
      }
    }
  }catch(e){console.warn('Batch translate failed, fallback:',e);}
  // fallback: แปลทีละชิ้น
  return await Promise.all(items.map(async n=>{
    const [thH,thX]=await Promise.all([
      translateTH(n.h),
      n.x?translateTH(n.x.slice(0,300)):Promise.resolve('')
    ]);
    return {...n,h:thH,x:thX};
  }));
}
