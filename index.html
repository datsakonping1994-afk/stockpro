<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดบัญชีวงไฮโล</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e4;--card:#fffdf6;--ink:#17332c;--mut:#6b7a73;--line:#ddd5bf;--acc:#12503f;--red:#c8372d;--win:#12703f;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f1a;--card:#17302a;--ink:#f1ead6;--mut:#9db0a8;--line:#2b4a41;--acc:#3fa583;--red:#ff7b6e;--win:#5fd09a;--on:#0f1f1a}}
:root[data-theme="dark"]{--bg:#0f1f1a;--card:#17302a;--ink:#f1ead6;--mut:#9db0a8;--line:#2b4a41;--acc:#3fa583;--red:#ff7b6e;--win:#5fd09a;--on:#0f1f1a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Thai",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:24px;font-weight:800;margin:4px 0 14px}
h2{font-size:16px;font-weight:800;margin:0 0 10px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,select,button{font:inherit;color:var(--ink)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:44px}
button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;min-height:44px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.pri{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:600}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.row>*{flex:1}.row>.fix{flex:none}
.seg button.on.w{background:var(--win);color:var(--on);border-color:var(--win);font-weight:600}
.seg button.on.l{background:var(--red);color:var(--on);border-color:var(--red);font-weight:600}
.ent{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.x{min-height:36px;padding:2px 10px;color:var(--red)}
.pos{color:var(--win);font-weight:800}.neg{color:var(--red);font-weight:800}
.pp{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.pp small{display:block;color:var(--mut)}
.big{font-size:26px;font-weight:800}
.mut{color:var(--mut);font-size:14px}
label{font-size:14px;color:var(--mut)}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kp button{font-size:20px;min-height:48px;padding:4px}
.kp .op{background:var(--card);font-weight:600}
.kp .eq{background:var(--acc);color:var(--on);border-color:var(--acc)}
.disp{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:64px;text-align:right;overflow-x:auto}
.disp .e{font-size:22px;font-weight:600;word-break:break-all}
.disp .r{font-size:14px;color:var(--mut)}
</style>
</head>
<body>
<main>
<h1>สมุดบัญชีวงไฮโล</h1>

<section>
<h2>ทุนที่คุณเติมเข้าเว็บ</h2>
<input id="cap" type="number" inputmode="decimal" value="10000" aria-label="ทุน">
</section>

<section>
<h2>บันทึกยอดแต่ละคน</h2>
<div class="row"><input id="pn" list="pl" placeholder="ชื่อ (พิมพ์ใหม่หรือเลือก)" maxlength="20"><datalist id="pl"></datalist></div>
<div class="row seg"><button id="bw" class="on w">ได้ (+)</button><button id="bl" class="l">เสีย (−)</button></div>
<button id="cancel" hidden style="width:100%;margin-bottom:8px">ยกเลิกการแก้ไข</button>
<div class="row"><input id="am" type="text" inputmode="decimal" autocomplete="off" placeholder="จำนวนเงิน เช่น 500+700-200"><button class="pri fix" id="add">บันทึก</button></div>
<div class="row" id="ops"><button data-op="+">+</button><button data-op="-">−</button><button data-op="b" aria-label="ลบตัวสุดท้าย">⌫</button></div>
<div id="apv" class="mut" style="min-height:22px;margin-bottom:6px"></div>
<div id="ents"></div>
<button id="undo" style="width:100%;margin-top:8px">↶ ย้อนกลับรายการล่าสุด</button>
</section>

<section>
<h2>เคลียร์เงินกับเพื่อน</h2>
<div id="people"></div>
<p class="mut" id="tot"></p>
</section>

<section>
<h2>ประวัติการแก้ไข</h2>
<p class="mut">ทุกการเพิ่ม แก้ไข ลบ ถูกบันทึกไว้ กด "ย้อนก่อนนี้" เพื่อกลับไปสถานะก่อนรายการนั้น การย้อนก็ถูกบันทึกและย้อนซ้ำได้</p>
<div id="hist"></div>
<button id="clearH" style="width:100%;margin-top:8px">ล้างประวัติอย่างเดียว (รายการยอดยังอยู่)</button>
</section>

<section>
<h2>เงินในเว็บ</h2>
<div class="mut">ควรเหลือ (ทุน + ผลรวมทุกคน)</div>
<div class="big" id="web"></div>
<div class="row" style="margin-top:10px"><label class="fix">ยอดจริงในเว็บ</label><input id="real" type="number" inputmode="decimal" placeholder="ใส่เพื่อเทียบ"></div>
<div id="diff" class="mut"></div>
<button id="clear" style="width:100%;margin-top:10px">ล้างทั้งหมด</button>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
let ents=[{n:"คนที่ 1",a:1000},{n:"คนที่ 2",a:-1000},{n:"เพื่อนคนที่ 3",a:-2000}],sign=1,editIdx=-1,hist=[];
const m=n=>Math.abs(n).toLocaleString("th-TH",{maximumFractionDigits:2});
const sg=n=>(n>0?"+":n<0?"−":"")+m(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  $("add").textContent=editIdx>=0?"บันทึกแก้ไข":"บันทึก";$("cancel").hidden=editIdx<0;apreview();renderHist();save();
  $("bw").classList.toggle("on",sign>0);$("bl").classList.toggle("on",sign<0);
  const by={};ents.forEach(e=>by[e.n]=(by[e.n]||0)+e.a);
  const names=Object.keys(by);
  $("pl").innerHTML=names.map(n=>`<option value="${esc(n)}">`).join("");
  $("ents").innerHTML=ents.length?ents.map((e,i)=>`<div class="ent"><span>${esc(e.n)}</span><span><span class="${e.a>0?"pos":"neg"}">${sg(e.a)}</span> <button class="x" style="color:var(--ink)" data-e="${i}" aria-label="แก้ไขรายการ">✎</button> <button class="x" data-i="${i}" aria-label="ลบรายการ">✕</button></span></div>`).join(""):'<p class="mut">ยังไม่มีรายการ</p>';
  let pay=0,get=0;
  $("people").innerHTML=names.map(n=>{
    const v=by[n];if(v>0)pay+=v;else get-=v;
    const t=v>0?`คุณต้องจ่ายให้ ${m(v)}`:v<0?`เก็บจากเขา ${m(v)}`:"เสมอ";
    return `<div class="pp"><div>${esc(n)}<small>${t}</small></div><div class="${v>0?"pos":v<0?"neg":""}">${sg(v)}</div></div>`;
  }).join("")||'<p class="mut">ยังไม่มีข้อมูล</p>';
  const sum=names.reduce((a,n)=>a+by[n],0),cap=parseFloat($("cap").value)||0;
  $("tot").innerHTML=`ต้องเก็บจากเพื่อน <b>${m(get)}</b> · ต้องจ่ายเพื่อน <b>${m(pay)}</b><br>ผลรวมทุกคน <b class="${sum>0?"pos":sum<0?"neg":""}">${sg(sum)}</b> (${sum>=0?"คนเล่นได้สุทธิ เว็บจ่ายออก":"คนเล่นเสียสุทธิ เว็บได้ไป"})`;
  const web=cap+sum;$("web").textContent=m(web)+" บาท";
  const r=$("real").value;
  if(r===""){$("diff").textContent="";}
  else{const d=parseFloat(r)-web;$("diff").innerHTML=Math.abs(d)<0.005?'<b class="pos">ตรงกัน</b>':`ต่างกัน <b class="${d>0?"pos":"neg"}">${sg(d)}</b> บาท (เช็กว่ามีรายการตกหล่นไหม)`;}
}
$("bw").onclick=()=>{sign=1;render();};
$("bl").onclick=()=>{sign=-1;render();};
$("add").onclick=()=>{
  const n=$("pn").value.trim(),v=amtVal();
  if(!n){$("pn").focus();return;}
  if(v===null||v===0){$("am").focus();return;}
  const a=v<0?v:sign*v;
  if(editIdx>=0&&ents[editIdx]){const o=ents[editIdx];logH(`แก้ไข ${o.n} ${sg(o.a)} → ${n} ${sg(a)}`);ents[editIdx]={n,a};}
  else{logH(`เพิ่ม ${n} ${sg(a)}`);ents.push({n,a});}
  editIdx=-1;$("pn").value="";$("am").value="";render();
};
$("am").onkeydown=e=>{if(e.key==="Enter")$("add").click();};
$("cap").oninput=$("real").oninput=render;
$("ents").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.e!==undefined){const i=+b.dataset.e,x=ents[i];editIdx=i;sign=x.a<0?-1:1;$("pn").value=x.n;$("am").value=Math.abs(x.a);render();$("am").focus();}
  else{const x=ents[+b.dataset.i];if(x)logH(`ลบ ${x.n} ${sg(x.a)}`);ents.splice(+b.dataset.i,1);editIdx=-1;render();}
};
$("cancel").onclick=()=>{editIdx=-1;$("pn").value="";$("am").value="";render();};
let clearArm=false,clearTimer;
const resetClear=()=>{clearArm=false;clearTimeout(clearTimer);$("clear").textContent="ล้างทั้งหมด";};
$("clear").onclick=()=>{
  if(!clearArm){
    clearArm=true;$("clear").textContent="กดอีกครั้งเพื่อยืนยัน (ลบรายการและประวัติทั้งหมด)";
    clearTimer=setTimeout(resetClear,4000);return;
  }
  resetClear();
  ents=[];hist=[];editIdx=-1;$("pn").value="";$("am").value="";render();
};
$("clearH").onclick=()=>{hist=[];render();};

/* ประวัติ */
function logH(label){hist.unshift({t:Date.now(),label,before:JSON.stringify(ents)});if(hist.length>100)hist.pop();}
function tm(t){return new Date(t).toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}
function renderHist(){
  $("hist").innerHTML=hist.length?hist.map((h,i)=>`<div class="ent"><span><small class="mut">${tm(h.t)}</small><br>${esc(h.label)}</span><button data-h="${i}">ย้อนก่อนนี้</button></div>`).join(""):'<p class="mut">ยังไม่มีประวัติ</p>';
  $("undo").disabled=!hist.length;
}
function restore(i){
  const h=hist[i];if(!h)return;
  logH(`ย้อนกลับ: ${h.label}`);
  ents=JSON.parse(h.before);editIdx=-1;$("pn").value="";$("am").value="";render();
}
$("hist").onclick=e=>{const b=e.target.closest("button");if(b)restore(+b.dataset.h);};
$("undo").onclick=()=>restore(0);
function save(){try{localStorage.setItem("hilo-ledger",JSON.stringify({ents,hist,cap:$("cap").value}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem("hilo-ledger")||"null");if(d){ents=d.ents||[];hist=d.hist||[];if(d.cap!==undefined)$("cap").value=d.cap;}}catch(e){}}

/* ช่องจำนวนเงินคิดเลขได้ */
function amtVal(){
  const s=$("am").value.replace(/[,\s]/g,"").replace(/−/g,"-").replace(/×/g,"*").replace(/÷/g,"/");
  return s?ev(s):null;
}
function apreview(){
  const v=amtVal();
  $("apv").innerHTML=v===null||v===0?"":`= <b>${m(v)}</b> บาท (${v<0||sign<0?"เสีย":"ได้"})`;
}
$("am").oninput=apreview;
["pointerdown","mousedown"].forEach(t=>$("ops").addEventListener(t,e=>e.preventDefault()));
$("ops").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const o=b.dataset.op,am=$("am");let s=am.value;
  if(o==="b")s=s.slice(0,-1);
  else{
    if(!s&&o!=="-")return;
    if(/[+\-*/×÷−]$/.test(s))s=s.slice(0,-1);
    s+=o;
  }
  am.value=s;apreview();am.focus();
};
function ev(s){
  const t=s.match(/\d+\.?\d*|\.\d+|[+\-*/]/g);if(!t)return null;
  if(t[0]==="-"&&t.length>1&&/^[\d.]/.test(t[1])){t[1]="-"+t[1];t.shift();}
  const nums=[],ops=[];
  for(let k=0;k<t.length;k++){
    if(k%2===0){if(!/^-?[\d.]/.test(t[k]))return null;nums.push(parseFloat(t[k]));}
    else{if(!/^[+\-*/]$/.test(t[k]))return null;ops.push(t[k]);}
  }
  if(nums.length!==ops.length+1)return null;
  const n2=[nums[0]],o2=[];
  for(let k=0;k<ops.length;k++){
    if(ops[k]==="*")n2[n2.length-1]*=nums[k+1];
    else if(ops[k]==="/"){if(nums[k+1]===0)return null;n2[n2.length-1]/=nums[k+1];}
    else{o2.push(ops[k]);n2.push(nums[k+1]);}
  }
  let r=n2[0];o2.forEach((o,k)=>{r=o==="+"?r+n2[k+1]:r-n2[k+1];});
  return Math.round(r*100)/100;
}

load();render();
</script>
</body>
</html>
