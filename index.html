      const uid=ticker+'_news_'+i;
      return`<div class="news-item" style="margin-bottom:10px">
        <div class="news-hl" style="cursor:${n.u?'pointer':'default'};font-size:13px;line-height:1.45;margin-bottom:5px" ${n.u?`onclick="window.open(encodeURI('${n.u}'),'_blank')"`:''}>
          ${n.u?`<span style="color:var(--accent);font-size:10px;margin-right:4px">🔗</span>`:''}${n.h}
        </div>
        ${fullSum?`
        <div id="${uid}_short" style="font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:4px">
          ${shortSum}${hasMore?`<span style="color:var(--accent);cursor:pointer;font-size:11px" onclick="
            document.getElementById('${uid}_short').style.display='none';
            document.getElementById('${uid}_full').style.display='block';
          "> ...อ่านต่อ</span>`:''}
        </div>
        ${hasMore?`<div id="${uid}_full" style="display:none;font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:4px">
          ${fullSum}<span style="color:var(--accent);cursor:pointer;font-size:11px" onclick="
            document.getElementById('${uid}_full').style.display='none';
            document.getElementById('${uid}_short').style.display='block';
          "> ย่อ</span>
        </div>`:''}
        `:''}
        <div class="news-meta" style="display:flex;justify-content:space-between;align-items:center">
          <span style="color:#6699bb;font-size:10px">${n.s||'Finnhub'}</span>
          <span style="font-size:10px;color:var(--dim)">${n.d}</span>
        </div>
      </div>`;
    }).join('')}`;
}

async function refreshNewsTab(ticker){
  delete liveNewsCache[ticker]; // force fresh fetch
  await renderNewsTab(ticker);
}

// Auto-refresh all open news tabs every 5 minutes — Fix 6: ย้ายไปใน startup() เพื่อให้แน่ใจว่า DOM พร้อมแล้ว

document.getElementById('updateTime').textContent=new Date().toLocaleTimeString('th-TH');
try {
  buildGrid();
} catch(e) {
  console.error('buildGrid error:', e);
  document.getElementById('grid').innerHTML = '<div style="color:var(--red);padding:20px;font-family:monospace">❌ Error: ' + e.message + '</div>';
}

// ── Clean startup sequence ───────────────────────────────────────────────────
async function applyIndicatorAll(mode='classic'){
  const st=document.getElementById('statusbar');
  st.innerHTML=`⏳ กำลังโหลด ${mode.toUpperCase()} Pivot ทุก card...`;
  // ── FIX 6: batch 8 + delay 150ms → indicator ครบใน ~1s (จากเดิม ~3s) ──
  for(let i=0;i<stocks.length;i+=8){
    await Promise.all(stocks.slice(i,i+8).map(s=>{
      const btn=document.querySelector(`#indselector-${s.t} .ind-btn.active`);
      return btn ? setIndicator(s.t,mode,btn) : Promise.resolve();
    }));
    await new Promise(r=>setTimeout(r,150));
  }
  document.getElementById('statusbar').innerHTML=`✅ Classic Pivot โหลดครบ · ${new Date().toLocaleTimeString('th-TH')}`;
  _pivotReady=true;
  updateAlerts();
}

// ═══════════════════════════════════════════════════════
// REFRESH ALL — ปุ่มเดียวดึงทุกอย่าง
// ═══════════════════════════════════════════════════════
async function refreshAll(){
  const btn=document.getElementById('refreshAllBtn');
  const st=document.getElementById('statusbar');
  btn.disabled=true;
  btn.textContent='⏳ กำลังรีเฟรช...';
  btn.style.opacity='0.6';
  try{

  // 1. ดึงราคาล่าสุดทุกหุ้น (HTTP)
  st.innerHTML='⏳ [1/4] ดึงราคาล่าสุด...';
  let priceOk=0;
  for(let i=0;i<stocks.length;i+=8){
    const batch=stocks.slice(i,i+8);
    await Promise.all(batch.map(async s=>{
      const d=await fetchOne(s.t);
      if(d){s.p=d.price;s.c=d.change;priceOk++;updateCard(s);}
    }));
    await new Promise(r=>setTimeout(r,200));
  }
  document.getElementById('upCnt').textContent=stocks.filter(s=>s.c>=0).length;
  document.getElementById('dnCnt').textContent=stocks.filter(s=>s.c<0).length;

  // 2. คำนวณ Indicator ใหม่ทุก card
  st.innerHTML=`✅ [1/4] ราคา ${priceOk} ตัว · ⏳ [2/4] คำนวณ Indicator...`;
  const indMode='classic';
  for(let i=0;i<stocks.length;i+=8){
    await Promise.all(stocks.slice(i,i+8).map(s=>{
      const btn2=document.querySelector(`#indselector-${s.t} .ind-btn.active`);
      const mode=tickerIndicator[s.t]||indMode;
      return btn2?setIndicator(s.t,mode,btn2):Promise.resolve();
    }));
    await new Promise(r=>setTimeout(r,200));
  }

  // 3. โหลด Sparkline + Volume + MA ใหม่
  st.innerHTML=`✅ [2/4] Indicator ครบ · ⏳ [3/4] โหลด Sparkline & MA...`;
  // clear candle cache เพื่อบังคับ re-fetch
  Object.keys(candleCache).forEach(k=>{ if(candleCache[k]) candleCache[k].ts=0; });
  await loadAllExtras();

  // 4. รีเฟรชข่าวทุก tab ที่เปิดอยู่
  st.innerHTML=`✅ [3/4] Sparkline ครบ · ⏳ [4/4] รีเฟรชข่าว...`;
  const openNewsTabs=document.querySelectorAll('.tab-pane.active[id^="news-"]');
  await Promise.all([...openNewsTabs].map(pane=>{
    const t=pane.id.replace('news-','');
    delete liveNewsCache[t];
    return renderNewsTab(t);
  }));

  // อัปเดต heatmap ถ้าเปิดอยู่
  if(currentView==='heat') renderHeatmap();

  // เสร็จ
  const now=new Date().toLocaleTimeString('th-TH');
  document.getElementById('updateTime').textContent=now;
  st.innerHTML=`✅ รีเฟรชครบทุกอย่าง · ราคา ${priceOk} ตัว · ${now}`;
  }catch(err){
    console.error('refreshAll error:',err);
    st.innerHTML='❌ เกิดข้อผิดพลาด — ลองใหม่อีกครั้ง';
  }finally{
    btn.disabled=false;
    btn.textContent='🔄 รีเฟรช';
    btn.style.opacity='1';
  }
}

async function startup(){
  // Fix 6: เริ่ม news timer หลัง buildGrid เพื่อให้ DOM card พร้อมแล้วก่อน
  newsRefreshTimer=setInterval(async()=>{
    document.querySelectorAll('.tab-pane.active[id^="news-"]').forEach(pane=>{
      const t=pane.id.replace('news-','');
      delete liveNewsCache[t];
      renderNewsTab(t);
    });
  },300000);
  // 1. Start live prices (WS + HTTP พร้อมกัน)
  toggleLive();
  // 2. Wait 1.5s แทน 3s — HTTP poll รอบแรกเสร็จใน ~3s แล้ว
  await new Promise(r=>setTimeout(r,1500));
  await applyIndicatorAll('classic');
  // 2.5 Wait for DOM to update with S1/R1 values before drawing sparklines
  await new Promise(r=>setTimeout(r,500));
  // 3. Load sparkline + volume + MA (uses daily candle API, separate from quote)
  await loadAllExtras();
  // 4. initialize zone states ก่อน เพื่อกัน popup ตอนเริ่ม
  stocks.forEach(s=>{
    const lvl=_getLevels(s.t,s.p);
    const levels=[
      {name:'S1',val:lvl.s1,type:'s'},{name:'S2',val:lvl.s2,type:'s'},{name:'S3',val:lvl.s3,type:'s'},
      {name:'R1',val:lvl.r1,type:'r'},{name:'R2',val:lvl.r2,type:'r'},{name:'R3',val:lvl.r3,type:'r'},
    ];
    levels.forEach(lv=>{
      if(!lv.val||lv.val<=0) return;
      const cur=lv.type==='s'?(s.p<=lv.val?'below':'above'):(s.p>=lv.val?'above':'below');
      zoneAlertState[s.t+'_'+lv.name]=cur;
    });
  });
  zoneAlertReady=true;
}

// Start directly (onboarding removed)
startup();
</script>
