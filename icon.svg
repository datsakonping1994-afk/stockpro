<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#0f0f2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0099cc"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff8c"/>
      <stop offset="100%" stop-color="#00c96e"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff4466"/>
      <stop offset="100%" stop-color="#cc2244"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <line x1="64" y1="160" x2="448" y2="160" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
  <line x1="64" y1="256" x2="448" y2="256" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
  <line x1="64" y1="352" x2="448" y2="352" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>

  <!-- Candlestick 1 — bearish (red) -->
  <line x1="130" y1="155" x2="130" y2="380" stroke="url(#red)" stroke-width="4" filter="url(#glow2)"/>
  <rect x="108" y="200" width="44" height="120" rx="5" fill="url(#red)" filter="url(#glow2)"/>

  <!-- Candlestick 2 — bullish (green) large -->
  <line x1="230" y1="120" x2="230" y2="390" stroke="url(#green)" stroke-width="4" filter="url(#glow2)"/>
  <rect x="208" y="160" width="44" height="180" rx="5" fill="url(#green)" filter="url(#glow2)"/>

  <!-- Candlestick 3 — bearish (red) small -->
  <line x1="330" y1="170" x2="330" y2="350" stroke="url(#red)" stroke-width="4" filter="url(#glow2)"/>
  <rect x="308" y="210" width="44" height="90" rx="5" fill="url(#red)" filter="url(#glow2)"/>

  <!-- Candlestick 4 — bullish (green) -->
  <line x1="420" y1="130" x2="420" y2="360" stroke="url(#green)" stroke-width="4" filter="url(#glow2)"/>
  <rect x="398" y="155" width="44" height="160" rx="5" fill="url(#green)" filter="url(#glow2)"/>

  <!-- Trend line glow (cyan) -->
  <polyline points="108,310 208,230 308,265 398,175"
    fill="none" stroke="url(#accent)" stroke-width="5"
    stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow)" opacity="0.9"/>

  <!-- Dot on trend line -->
  <circle cx="398" cy="175" r="10" fill="#00d4ff" filter="url(#glow)" opacity="0.95"/>
  <circle cx="398" cy="175" r="5" fill="#fff"/>

  <!-- Bottom bar (accent line) -->
  <rect x="64" y="440" width="384" height="6" rx="3" fill="url(#accent)" opacity="0.6"/>
</svg>