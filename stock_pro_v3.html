<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Stock Pro V3</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b10;--bg2:#0d1117;--bg3:#141921;--bg4:#1a2130;
  --border:#1e2a3a;--border2:#253040;
  --accent:#00d4ff;--accent2:#0099cc;
  --green:#00e676;--green2:#00b050;
  --red:#ff4466;--red2:#cc2244;
  --yellow:#ffd700;--orange:#ff8c00;
  --purple:#a855f7;
  --text:#e8f4ff;--text2:#9bb5cc;--dim:#4a6070;
  --mono:'Space Mono',monospace;
  --thai:'Noto Sans Thai',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:var(--thai);font-size:14px;min-height:100vh;overflow-x:hidden;}
button{cursor:pointer;font-family:inherit;border:none;outline:none;}
input{outline:none;font-family:inherit;}

/* ── TOP BAR ── */
.topbar{position:sticky;top:0;z-index:100;background:rgba(8,11,16,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.logo{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);letter-spacing:1px;white-space:nowrap;}
.logo span{color:var(--text2);font-weight:400;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0;}
.live-dot.on{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse-dot 1.5s infinite;}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.4}}
.status-txt{font-family:var(--mono);font-size:10px;color:var(--dim);white-space:nowrap;}
.btn-live{font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:5px;border:1px solid var(--green);background:rgba(0,230,118,0.08);color:var(--green);transition:all 0.2s;}
.btn-live.stop{border-color:var(--red);background:rgba(255,68,102,0.08);color:var(--red);}

/* ── NAV TABS ── */
.nav{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);overflow-x:auto;scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.nav-tab{font-family:var(--mono);font-size:11px;padding:10px 16px;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;transition:all 0.2s;flex-shrink:0;}
.nav-tab.active{color:var(--accent);border-color:var(--accent);}
.nav-tab:hover{color:var(--text2);}
.nav-badge{background:var(--red);color:#fff;font-size:9px;padding:1px 4px;border-radius:8px;margin-left:4px;vertical-align:middle;}

/* ── PAGE CONTAINERS ── */
.page{display:none;padding:12px;}
.page.active{display:block;}

/* ── SEARCH + SORT ── */
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center;}
.search-box{flex:1;min-width:120px;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:7px;font-size:13px;}
.search-box::placeholder{color:var(--dim);}
.sort-btn{font-family:var(--mono);font-size:10px;padding:5px 10px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);color:var(--dim);transition:all 0.2s;}
.sort-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(0,212,255,0.08);}

/* ── MARKET STATUS BAR ── */
.mkt-bar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--dim);overflow-x:auto;scrollbar-width:none;}
.mkt-bar::-webkit-scrollbar{display:none;}
.mkt-stat{display:flex;align-items:center;gap:4px;white-space:nowrap;}
.mkt-stat span{color:var(--text2);}

/* ── STOCK CARDS ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color 0.2s;}
.card:hover{border-color:var(--border2);}
.card.near-s{border-color:rgba(255,68,102,0.4);box-shadow:0 0 12px rgba(255,68,102,0.08);}
.card.near-r{border-color:rgba(0,230,118,0.3);box-shadow:0 0 12px rgba(0,230,118,0.06);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px 6px;}
.card-left{}
.card-ticker{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--text);}
.card-name{font-size:11px;color:var(--dim);margin-top:1px;}
.card-right{text-align:right;}
.card-price{font-family:var(--mono);font-size:16px;font-weight:700;}
.card-price.up{color:var(--green);}
.card-price.dn{color:var(--red);}
.card-price.flat{color:var(--text2);}
.card-chg{font-family:var(--mono);font-size:11px;margin-top:1px;}

/* ── SPARKLINE ── */
.spark-wrap{position:relative;height:70px;padding:0 12px;margin:2px 0;}
.spark-canvas{width:100%;height:70px;display:block;}

/* ── LEVELS BAR ── */
.levels-bar{padding:6px 12px 8px;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;}
.lvl-s{color:var(--red);background:rgba(255,68,102,0.1);padding:2px 6px;border-radius:4px;}
.lvl-r{color:var(--green);background:rgba(0,230,118,0.1);padding:2px 6px;border-radius:4px;}
.lvl-sep{color:var(--dim);}

/* ── CARD TABS ── */
.card-tabs{display:flex;border-top:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.card-tabs::-webkit-scrollbar{display:none;}
.card-tab{font-family:var(--mono);font-size:10px;padding:7px 12px;color:var(--dim);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.card-tab.active{color:var(--accent);border-color:var(--accent);}
.card-content{padding:10px 12px;min-height:60px;}

/* ── TECHNICAL ── */
.tech-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.tech-item{background:var(--bg3);border-radius:6px;padding:6px 8px;}
.tech-label{font-size:10px;color:var(--dim);font-family:var(--mono);}
.tech-val{font-family:var(--mono);font-size:13px;font-weight:700;margin-top:2px;}
.tech-val.bull{color:var(--green);}
.tech-val.bear{color:var(--red);}
.tech-val.neut{color:var(--yellow);}

/* ── PIVOT TABLE ── */
.pivot-wrap{margin-top:6px;}
.pivot-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:11px;}
.pivot-row:last-child{border:none;}
.pivot-s{color:var(--red);}
.pivot-r{color:var(--green);}
.pivot-pp{color:var(--accent);}
.pivot-tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;}
.pivot-tab{font-family:var(--mono);font-size:9px;padding:3px 8px;border-radius:4px;border:1px solid var(--border);color:var(--dim);cursor:pointer;}
.pivot-tab.active{border-color:var(--accent);color:var(--accent);}

/* ── AI TAB ── */
.ai-wrap{display:flex;flex-direction:column;gap:8px;}
.ai-analyze-btn{width:100%;padding:8px;border-radius:7px;background:linear-gradient(135deg,rgba(0,212,255,0.15),rgba(168,85,247,0.1));border:1px solid rgba(0,212,255,0.3);color:var(--accent);font-family:var(--mono);font-size:12px;transition:all 0.2s;}
.ai-analyze-btn:hover{background:rgba(0,212,255,0.2);}
.ai-analyze-btn:disabled{opacity:0.5;cursor:not-allowed;}
.ai-tags{display:flex;gap:4px;flex-wrap:wrap;}
.ai-tag{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--border);}
.ai-result{background:var(--bg3);border-radius:7px;padding:10px;font-size:12px;color:var(--text2);line-height:1.7;min-height:40px;}
.ai-chat-row{display:flex;gap:6px;margin-top:6px;}
.ai-chat-input{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:7px;font-size:12px;}
.ai-chat-send{padding:7px 12px;border-radius:7px;background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.3);color:var(--accent);}

/* ── ALERTS PAGE ── */
.alert-section{margin-bottom:16px;}
.section-title{font-family:var(--mono);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.alert-list{display:flex;flex-direction:column;gap:6px;}
.alert-item{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;}
.alert-item.s{border-left:3px solid var(--red);}
.alert-item.r{border-left:3px solid var(--green);}
.alert-ticker{font-family:var(--mono);font-size:13px;font-weight:700;}
.alert-info{font-size:11px;color:var(--text2);margin-top:2px;}
.alert-pct{font-family:var(--mono);font-size:12px;}
.alert-pct.close{color:var(--red);}
.alert-pct.mid{color:var(--yellow);}
.alert-empty{color:var(--dim);font-size:12px;text-align:center;padding:20px 0;}

/* ── EARNINGS PAGE ── */
.earn-list{display:flex;flex-direction:column;gap:8px;}
.earn-item{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.earn-header{display:flex;justify-content:space-between;align-items:center;}
.earn-ticker{font-family:var(--mono);font-size:13px;font-weight:700;}
.earn-date{font-family:var(--mono);font-size:11px;color:var(--dim);}
.earn-badge{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;}
.earn-badge.today{background:rgba(255,215,0,0.15);border:1px solid rgba(255,215,0,0.3);color:var(--yellow);}
.earn-badge.soon{background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.2);color:var(--accent);}
.earn-badge.past{background:var(--bg3);border:1px solid var(--border);color:var(--dim);}
.earn-detail{margin-top:6px;font-size:11px;color:var(--text2);}

/* ── PORTFOLIO PAGE ── */
.port-summary{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;}
.port-total{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--text);}
.port-pnl{font-family:var(--mono);font-size:14px;margin-top:4px;}
.port-pnl.pos{color:var(--green);}
.port-pnl.neg{color:var(--red);}
.port-positions{display:flex;flex-direction:column;gap:6px;}
.port-item{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.port-item-top{display:flex;justify-content:space-between;align-items:center;}
.port-pnl-bar{height:3px;border-radius:2px;margin-top:8px;background:var(--bg3);overflow:hidden;}
.port-pnl-fill{height:100%;border-radius:2px;transition:width 0.4s;}
.port-pnl-fill.pos{background:var(--green);}
.port-pnl-fill.neg{background:var(--red);}
.add-port-btn{width:100%;padding:10px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--dim);font-family:var(--mono);font-size:12px;margin-top:10px;transition:all 0.2s;}
.add-port-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:9999;display:none;align-items:flex-end;justify-content:center;padding:0;}
.modal-overlay.show{display:flex;}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;max-height:80vh;overflow-y:auto;}
.modal-title{font-family:var(--mono);font-size:14px;color:var(--accent);margin-bottom:16px;}
.modal-input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:10px;}
.modal-input:focus{border-color:var(--accent);}
.modal-label{font-size:12px;color:var(--dim);margin-bottom:4px;}
.modal-btns{display:flex;gap:8px;margin-top:8px;}
.modal-confirm{flex:1;padding:10px;border-radius:8px;background:rgba(0,212,255,0.15);border:1px solid rgba(0,212,255,0.3);color:var(--accent);font-family:var(--mono);font-size:13px;}
.modal-cancel{padding:10px 16px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--dim);font-family:var(--mono);font-size:13px;}

/* ── TOAST ── */
.toast-container{position:fixed;top:60px;right:12px;z-index:9998;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.toast-item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;font-family:var(--mono);font-size:12px;max-width:280px;opacity:0;transform:translateX(20px);transition:all 0.3s;pointer-events:auto;}
.toast-item.show{opacity:1;transform:translateX(0);}
.toast-item.s{border-left:3px solid var(--red);}
.toast-item.r{border-left:3px solid var(--green);}
.toast-item.near{border-left:3px solid var(--yellow);}

/* ── SIGNAL POPUP ── */
.signal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9997;display:none;align-items:center;justify-content:center;padding:16px;}
.signal-overlay.show{display:flex;}
.signal-box{background:var(--bg2);border:1px solid rgba(0,230,118,0.4);border-radius:14px;padding:18px;width:100%;max-width:360px;box-shadow:0 0 30px rgba(0,230,118,0.1);}
.signal-title{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--green);margin-bottom:10px;}
.signal-score-bar{height:5px;background:var(--bg4);border-radius:3px;margin-bottom:12px;overflow:hidden;}
.signal-score-fill{height:100%;border-radius:3px;transition:width 0.6s;}
.signal-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;}
.signal-label{color:var(--dim);font-family:var(--mono);}
.signal-val{font-family:var(--mono);font-weight:700;}
.signal-divider{border:none;border-top:1px solid var(--border);margin:10px 0;}
.signal-ai{background:var(--bg3);border-radius:8px;padding:10px;font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:10px;min-height:40px;}
.signal-btns{display:flex;gap:8px;}
.signal-goto{flex:1;padding:8px;border-radius:7px;background:rgba(0,230,118,0.12);border:1px solid rgba(0,230,118,0.3);color:var(--green);font-family:var(--mono);font-size:11px;}
.signal-close{padding:8px 14px;border-radius:7px;background:var(--bg3);border:1px solid var(--border);color:var(--dim);font-family:var(--mono);font-size:11px;}

/* ── LOADING ── */
.loading{text-align:center;color:var(--dim);font-family:var(--mono);font-size:12px;padding:24px 0;}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin-right:6px;vertical-align:middle;}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MISC ── */
.chip{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:4px;border:1px solid var(--border);color:var(--text2);}
.chip.bull{border-color:rgba(0,230,118,0.3);color:var(--green);background:rgba(0,230,118,0.08);}
.chip.bear{border-color:rgba(255,68,102,0.3);color:var(--red);background:rgba(255,68,102,0.08);}
.chip.neut{border-color:rgba(255,215,0,0.3);color:var(--yellow);background:rgba(255,215,0,0.08);}
.divider{border:none;border-top:1px solid var(--border);margin:10px 0;}
.empty{text-align:center;color:var(--dim);font-size:12px;padding:24px 0;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">◈ STOCK<span> PRO V3</span></div>
  <div class="topbar-right">
    <div class="live-dot" id="liveDot"></div>
    <span class="status-txt" id="statusTxt">กด Live</span>
    <button class="btn-live" id="liveBtn" onclick="toggleLive()">▶ Live</button>
  </div>
</div>

<!-- MARKET STATUS BAR -->
<div class="mkt-bar" id="mktBar">
  <div class="mkt-stat">ตลาด: <span id="mktStatus">—</span></div>
  <div class="mkt-stat">UP: <span id="mktUp" style="color:var(--green)">—</span></div>
  <div class="mkt-stat">DN: <span id="mktDn" style="color:var(--red)">—</span></div>
  <div class="mkt-stat">Near S: <span id="mktNearS" style="color:var(--yellow)">—</span></div>
</div>

<!-- NAV -->
<div class="nav">
  <div class="nav-tab active" onclick="goPage('watchlist',this)">หุ้น</div>
  <div class="nav-tab" onclick="goPage('alerts',this)">แจ้งเตือน <span class="nav-badge" id="alertBadge" style="display:none">0</span></div>
  <div class="nav-tab" onclick="goPage('earnings',this)">Earnings</div>
  <div class="nav-tab" onclick="goPage('portfolio',this)">Portfolio</div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<!-- SIGNAL POPUP -->
<div class="signal-overlay" id="signalOverlay" onclick="if(event.target===this)closeSignal()">
  <div class="signal-box" id="signalBox"></div>
</div>

<!-- ADD POSITION MODAL -->
<div class="modal-overlay" id="addPortModal">
  <div class="modal-box">
    <div class="modal-title">➕ เพิ่มหุ้นใน Portfolio</div>
    <div class="modal-label">Ticker</div>
    <input class="modal-input" id="portTicker" placeholder="เช่น RKLB" style="text-transform:uppercase">
    <div class="modal-label">จำนวนหุ้น</div>
    <input class="modal-input" id="portShares" type="number" placeholder="เช่น 100">
    <div class="modal-label">ราคาต้นทุน ($/หุ้น)</div>
    <input class="modal-input" id="portCost" type="number" step="0.01" placeholder="เช่น 85.50">
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal('addPortModal')">ยกเลิก</button>
      <button class="modal-confirm" onclick="confirmAddPort()">เพิ่ม</button>
    </div>
  </div>
</div>

<!-- PAGE: WATCHLIST -->
<div class="page active" id="page-watchlist">
  <div class="toolbar">
    <input class="search-box" id="searchBox" placeholder="ค้นหา..." oninput="filterCards()">
    <button class="sort-btn active" id="sort-%Change" onclick="setSort('%Change',this)">%</button>
    <button class="sort-btn" id="sort-RSI" onclick="setSort('RSI',this)">RSI</button>
    <button class="sort-btn" id="sort-NearS" onclick="setSort('NearS',this)">S</button>
    <button class="sort-btn" id="sort-AZ" onclick="setSort('AZ',this)">A-Z</button>
  </div>
  <div class="cards-grid" id="cardsGrid"></div>
</div>

<!-- PAGE: ALERTS -->
<div class="page" id="page-alerts">
  <div class="alert-section">
    <div class="section-title">🔴 ใกล้แนวรับ</div>
    <div class="alert-list" id="alertListS"><div class="alert-empty">ไม่มีสัญญาณ</div></div>
  </div>
  <div class="alert-section">
    <div class="section-title">🟢 ใกล้แนวต้าน</div>
    <div class="alert-list" id="alertListR"><div class="alert-empty">ไม่มีสัญญาณ</div></div>
  </div>
</div>

<!-- PAGE: EARNINGS -->
<div class="page" id="page-earnings">
  <div class="loading" id="earnLoading"><span class="spinner"></span>กำลังโหลด...</div>
  <div class="earn-list" id="earnList" style="display:none"></div>
</div>

<!-- PAGE: PORTFOLIO -->
<div class="page" id="page-portfolio">
  <div class="port-summary" id="portSummary">
    <div style="font-size:11px;color:var(--dim);font-family:var(--mono);margin-bottom:4px">PORTFOLIO VALUE</div>
    <div class="port-total" id="portTotal">$0.00</div>
    <div class="port-pnl" id="portPnl">—</div>
  </div>
  <div class="port-positions" id="portList"><div class="empty">ยังไม่มีหุ้นในพอร์ต</div></div>
  <button class="add-port-btn" onclick="openModal('addPortModal')">+ เพิ่มหุ้น</button>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════
const WORKER = 'https://anthropic-proxy.datsakonping1994.workers.dev';
const NEAR_S_PCT = 2.0;  // % ห่าง S1 ที่ถือว่าใกล้แนวรับ

// ═══════════════════════════════════════════
// STOCKS

function isMarketOpen(){
  const d=new Date(), h=d.getUTCHours(), m=d.getUTCMinutes(), day=d.getUTCDay();
  return day>=1&&day<=5&&(h>13||(h===13&&m>=30))&&h<20;
}
function isPreMarket(){
  const d=new Date(), h=d.getUTCHours(), m=d.getUTCMinutes(), day=d.getUTCDay();

// ═══════════════════════════════════════════
// PIVOT CALCULATIONS
// ═══════════════════════════════════════════
function calcPivotClassic(h,l,c){
  const pp=(h+l+c)/3;
  return{pp,s1:2*pp-h,s2:pp-(h-l),s3:pp-2*(h-l),r1:2*pp-l,r2:pp+(h-l),r3:pp+2*(h-l)};
}
function calcPivotCamarilla(h,l,c){
  const r=(h-l);
  return{pp:c,s1:c-r*1.1/12,s2:c-r*1.1/6,s3:c-r*1.1/4,r1:c+r*1.1/12,r2:c+r*1.1/6,r3:c+r*1.1/4};
}
function calcPivotFibonacci(h,l,c){
  const pp=(h+l+c)/3, r=h-l;
  return{pp,s1:pp-0.382*r,s2:pp-0.618*r,s3:pp-r,r1:pp+0.382*r,r2:pp+0.618*r,r3:pp+r};
}
function getLevels(ticker, price, pivotType='classic'){
  const data = candleCache[ticker]?.data;
  if(data&&data.h&&data.h.length>=5){
    const n=data.h.length;
    const h=Math.max(...data.h.slice(-20));
    const l=Math.min(...data.l.slice(-20));
    const c=data.c[n-1]||price;
    const fn={classic:calcPivotClassic,camarilla:calcPivotCamarilla,fibonacci:calcPivotFibonacci}[pivotType]||calcPivotClassic;
    return fn(h,l,c);
  }
  // fallback ไม่มีข้อมูล
  const pp=price;
  const atr=price*0.03;
  return{pp,s1:pp-atr,s2:pp-atr*2,s3:pp-atr*3,r1:pp+atr,r2:pp+atr*2,r3:pp+atr*3};
}

// ═══════════════════════════════════════════
// RSI / EMA / MACD
// ═══════════════════════════════════════════
function calcRSI(closes, period=14){
  if(closes.length<period+1) return 50;
  let gains=0,losses=0;
  for(let i=1;i<=period;i++){const d=closes[i]-closes[i-1];if(d>0)gains+=d;else losses-=d;}
  let ag=gains/period,al=losses/period;
  for(let i=period+1;i<closes.length;i++){
    const d=closes[i]-closes[i-1];
    ag=((ag*(period-1))+(d>0?d:0))/period;
    al=((al*(period-1))+(d<0?-d:0))/period;
  }
  return al===0?100:100-100/(1+ag/al);
}
function calcEMA(arr, n){
  if(arr.length<n) return arr[arr.length-1]||0;
  const k=2/(n+1); let e=arr.slice(0,n).reduce((a,b)=>a+b,0)/n;
  for(let i=n;i<arr.length;i++) e=arr[i]*k+e*(1-k);
  return +e.toFixed(3);
}
function calcMACD(closes){
  if(closes.length<26) return{line:0,signal:0,hist:0};
  const e12=calcEMA(closes,12), e26=calcEMA(closes,26);
  const line=+(e12-e26).toFixed(3);
  // signal line approximation
  const macdSeries=[];
  for(let i=25;i<closes.length;i++){
    const c=closes.slice(0,i+1);
    macdSeries.push(calcEMA(c,12)-calcEMA(c,26));
  }
  const signal=macdSeries.length>=9?+calcEMA(macdSeries,9).toFixed(3):line;
  return{line,signal,hist:+(line-signal).toFixed(3)};
}
function updateIndicators(ticker){
  const data=candleCache[ticker]?.data;
  if(!data||!data.c||data.c.length<10) return;
  const c=data.c;
  const s=stocks.find(x=>x.t===ticker);
  if(!s) return;
  s.rsi=+calcRSI(c).toFixed(1);
  s.ema20=calcEMA(c,20);
  s.ema50=calcEMA(c,50);
  s.ema200=calcEMA(c,200);
  const m=calcMACD(c);
  s.macd=m.line; s.macdSignal=m.signal;
  const lvl=getLevels(ticker,s.p);
  s.s1=lvl.s1; s.s2=lvl.s2; s.r1=lvl.r1; s.r2=lvl.r2; s.pp=lvl.pp;
}

async function fetchYahooPrice(ticker){
  try{
    const url=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1m&range=1d`;
    const r=await fetch(`${WORKER}/yahoo/?url=${encodeURIComponent(url)}`);
    if(!r.ok) return null;
    const d=await r.json();
    const res=d?.chart?.result?.[0];
    if(!res) return null;
    const price=res.meta?.regularMarketPrice||0;
    const prev=res.meta?.previousClose||price;
    const change=prev>0?+((price-prev)/prev*100).toFixed(2):0;
    return price>0?{price,change,high:res.meta?.regularMarketDayHigh||price,low:res.meta?.regularMarketDayLow||price,prev}:null;
  }catch{return null;}
}
async function fetchFinnhubPrice(ticker){
  try{
    const r=await fetch(`${WORKER}/finnhub/quote?symbol=${ticker}`);
    if(!r.ok) return null;
    const d=await r.json();
    const price=d.c>0?d.c:(d.pc>0?d.pc:0);
    if(price<=0) return null;
    return{price,change:d.dp?+d.dp.toFixed(2):0,high:d.h||price,low:d.l||price,prev:d.pc||price};
  }catch{return null;}
}
async function fetchOnePrice(ticker){
  let d=await Promise.race([fetchYahooPrice(ticker),fetchFinnhubPrice(ticker),new Promise(r=>setTimeout(()=>r(null),6000))]);
  if(!d) d=await fetchFinnhubPrice(ticker);
  if(!d) d=await fetchYahooPrice(ticker);
  return d;
}
async function fetchCandles(ticker, days=90){
  if(candleCache[ticker]?.ts>Date.now()-300000&&(candleCache[ticker]?.days||0)>=days) return candleCache[ticker].data;
  try{
    const range=days<=30?'1mo':days<=90?'3mo':days<=180?'6mo':'1y';
    const url=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=${range}`;
    for(const proxy of[`${WORKER}/yahoo/?url=${encodeURIComponent(url)}`,`https://corsproxy.io/?url=${encodeURIComponent(url)}`]){
      try{
        const ctrl=new AbortController();
        const tid=setTimeout(()=>ctrl.abort(),5000);
        const r=await fetch(proxy,{signal:ctrl.signal});
        clearTimeout(tid);
        if(!r.ok) continue;
        const d=await r.json();
        const res=d?.chart?.result?.[0];
        if(!res?.indicators?.quote?.[0]) continue;
        const q=res.indicators.quote[0];
        const data={t:res.timestamp,c:q.close,h:q.high,l:q.low,o:q.open,v:q.volume};
        candleCache[ticker]={data,ts:Date.now(),days};
        return data;
      }catch{}
    }
  }catch{}
  return null;
}

async function _fetchWsKey(){
  try{
    const r=await fetch(`${WORKER}/finnhub/ws-key`);
    if(r.ok){const d=await r.json();_wsKey=d.key;}
  }catch{}
}
async function wsConnect(){
  if(ws&&ws.readyState<=1) return;
  clearTimeout(_wsReconnectTimer);
  if(!_wsKey) await _fetchWsKey();
  ws=new WebSocket(`wss://ws.finnhub.io?token=${_wsKey}`);
  ws.onopen=()=>{
    wsReady=true;_wsReconnectCount=0;
    setStatus('🟢 WS Real-time','on');
    stocks.slice(0,50).forEach(s=>ws.send(JSON.stringify({type:'subscribe',symbol:s.t})));
    clearInterval(_wsPingInterval);
    _wsPingInterval=setInterval(()=>{if(ws.readyState===1)ws.send(JSON.stringify({type:'ping'}));},20000);
    clearInterval(_pollTimer);
    _pollTimer=setInterval(()=>{if(isLive)httpPoll(stocks.slice(50));},30000);
  };
  ws.onmessage=e=>{
    try{
      const msg=JSON.parse(e.data);
      if(msg.type!=='trade'||!msg.data) return;
      msg.data.forEach(trade=>{
        const s=stocks.find(x=>x.t===trade.s);
        if(!s||!trade.p||trade.p<=0) return;
        const prev=s.p||trade.p;
        const prevClose=candleCache[s.t]?.data?.c?.slice(-2,-1)[0]||prev;
        s.p=trade.p;
        s.c=prevClose>0?+((trade.p-prevClose)/prevClose*100).toFixed(2):0;
        updateCardPrice(s);
        checkZoneAlert(s.t,s.p,s.s1,s.r1);
      });
    }catch{}
  };
  ws.onclose=()=>{
    wsReady=false;clearInterval(_wsPingInterval);
    if(!isLive) return;
    _wsReconnectCount++;
    const n=new Date(),h=n.getUTCHours(),m=n.getUTCMinutes(),day=n.getUTCDay();
    const open=day>=1&&day<=5&&(h>13||(h===13&&m>=30))&&h<20;
    if(!open||_wsReconnectCount>15){
      setStatus(open?'⚫ WS หยุด':'⏸ ตลาดปิด · HTTP poll','');
      clearInterval(_pollTimer);
      _pollTimer=setInterval(()=>{if(isLive)httpPoll(stocks);},30000);
      return;
    }
    const delay=Math.min(1000*Math.pow(2,_wsReconnectCount-1),10000);
    setStatus(`🔴 WS หลุด เชื่อมใหม่ใน ${(delay/1000).toFixed(0)}s`,'');
    clearInterval(_pollTimer);
    _pollTimer=setInterval(()=>{if(isLive&&!wsReady)httpPoll(stocks);},5000);
    _wsReconnectTimer=setTimeout(async()=>{
      if(isLive&&(!ws||ws.readyState>1)){await _fetchWsKey();wsConnect();}
    },delay);
  };
  ws.onerror=()=>{if(ws) ws.close();};
}
async function httpPoll(list){
  if(_pollRunning) return;
  _pollRunning=true;
  try{
    await Promise.all((list||stocks).slice(0,20).map(async s=>{
      const d=await fetchOnePrice(s.t);
      if(d){s.p=d.price;s.c=d.change;updateCardPrice(s);checkZoneAlert(s.t,s.p,s.s1,s.r1);}
    }));
  }finally{_pollRunning=false;}
}

// ═══════════════════════════════════════════
// ZONE ALERT
// ═══════════════════════════════════════════
function checkZoneAlert(ticker, price, s1, r1){
  if(!s1||!r1||!price) return;
  const levels=[
    {name:'S1',val:s1,type:'s'},{name:'R1',val:r1,type:'r'},
  ];
  for(const lv of levels){
    if(!lv.val||lv.val<=0) continue;
    const key=ticker+'_'+lv.name;
    const prev=_zoneAlertState[key]||'above';
    const cur=lv.type==='s'?(price<=lv.val?'below':'above'):(price>=lv.val?'above':'below');
    if(cur!==prev){
      _zoneAlertState[key]=cur;
      const crossed=(lv.type==='s'&&cur==='below')||(lv.type==='r'&&cur==='above');
      if(crossed){
        playAlertSound(lv.type);
        showToast(ticker,lv.type,lv.name,price,lv.val);
        if(lv.name==='S1'&&lv.type==='s') showSignalPopupFull(ticker,price,s1,r1);
      }
    }
    // near S1 ≤ 0.5% toast
    if(lv.name==='S1'&&lv.type==='s'&&cur==='above'){
      const pctNear=s1>0?((price-s1)/s1*100):99;
      const nearKey=ticker+'_S1_near';
      if(pctNear<=0.5&&!_zoneAlertState[nearKey]){
        _zoneAlertState[nearKey]=true;
        showToast(ticker,'near','S1',price,s1);
      }else if(pctNear>2) _zoneAlertState[nearKey]=false;
    }
  }
  // pulse card
  const card=document.getElementById('card-'+ticker);
  if(card){
    card.classList.remove('near-s','near-r');
    const pctS=s1>0?((price-s1)/s1*100):99;
    if(pctS<=NEAR_S_PCT||price<=s1) card.classList.add('near-s');
    else{const pctR=r1>0?((r1-price)/r1*100):99;if(pctR<=NEAR_S_PCT) card.classList.add('near-r');}
  }
}

  setTimeout(()=>{div.classList.remove('show');setTimeout(()=>div.remove(),300);},6000);

  const badge=document.getElementById('alertBadge');

// SOUND
// ═══════════════════════════════════════════
function playAlertSound(type){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const freqs=type==='s'?[[400,0],[320,0.15]]:[[600,0],[750,0.15]];
    freqs.forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.frequency.value=f;
      g.gain.setValueAtTime(0.12,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.3);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.35);
    });
  }catch{}
}

function showSignalPopupFull(ticker,price,s1,r1){
  const s=stocks.find(x=>x.t===ticker);
  if(!s) return;
  const rr=s1>0&&r1>0?((r1-price)/(price-s1)).toFixed(1):'N/A';
  const rsi=s.rsi||50;
  const rsiLabel=rsi<=30?'Oversold':rsi>=70?'Overbought':'Neutral';
  const rsiColor=rsi<=30?'var(--green)':rsi>=70?'var(--red)':'var(--yellow)';
  const macdBull=s.macd>0&&s.macdSignal&&s.macd>s.macdSignal;
  const vol=candleCache[ticker]?.data?.v||[];
  const volLast=vol[vol.length-1]||0;
  const volAvg=vol.slice(-20).reduce((a,b)=>a+b,0)/Math.min(20,vol.length)||1;
  const volRatio=+(volLast/volAvg).toFixed(2);
  const score=Math.min(100,
    (rsi<=30?20:rsi<=45?12:5)+
    ((price-s1)/s1*100<=1?25:15)+
    (macdBull?15:0)+
    (volRatio>=1.5?15:volRatio>=1?8:0)
  );
  const scoreColor=score>=70?'var(--green)':score>=50?'var(--yellow)':'var(--red)';
  const scoreLabel=score>=70?'แข็งแกร่ง':score>=50?'ปานกลาง':'อ่อนแอ';
  const popupId='pop-'+ticker+'-'+Date.now();

  document.getElementById('signalBox').innerHTML=`
    <div class="signal-title">🔔 ทะลุแนวรับ ${ticker}
      <span style="font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(0,0,0,0.3);color:${scoreColor};margin-left:6px">Score ${score} · ${scoreLabel}</span>
    </div>
    <div class="signal-score-bar"><div class="signal-score-fill" style="width:${score}%;background:${scoreColor}"></div></div>
    <div class="signal-row"><span class="signal-label">💰 ราคา</span><span class="signal-val">$${fmt(price)}</span></div>
    <div class="signal-row"><span class="signal-label">🛡️ S1</span><span class="signal-val" style="color:var(--red)">$${fmt(s1)}</span></div>

async function callAI(system, user, maxTokens=800){
  // ลอง Claude ก่อน
  try{
    const r=await fetch(WORKER,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-haiku-4-5',max_tokens:maxTokens,system,messages:[{role:'user',content:user}]})
    });
    if(r.ok){const d=await r.json();if(d.type!=='error'&&d.content?.length) return d.content.filter(b=>b.type==='text').map(b=>b.text).join('');}
  }catch{}
  // Fallback: Gemini
  try{
    const r=await fetch(WORKER+'/gemini/',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({system_instruction:{parts:[{text:system}]},contents:[{parts:[{text:user}]}],generationConfig:{maxOutputTokens:maxTokens,temperature:0.7}})
    });
    if(r.ok){const d=await r.json();return d?.candidates?.[0]?.content?.parts?.[0]?.text||null;}
  }catch{}
  return null;
}

function sortStocksList(){
  const sorted=[...stocks];
  if(currentSort==='%Change') sorted.sort((a,b)=>b.c-a.c);
  else if(currentSort==='RSI') sorted.sort((a,b)=>a.rsi-b.rsi);
  else if(currentSort==='NearS') sorted.sort((a,b)=>{
    const pa=a.s1>0?((a.p-a.s1)/a.s1*100):99;
    const pb=b.s1>0?((b.p-b.s1)/b.s1*100):99;
    return pa-pb;
  });
  else sorted.sort((a,b)=>a.t.localeCompare(b.t));
  return sorted;
}

// SPARKLINE
// ═══════════════════════════════════════════
function drawSparkline(ticker){
  const canvas=document.getElementById('spark-'+ticker);
  const wrap=document.getElementById('spark-wrap-'+ticker);
  if(!canvas||!wrap) return;
  const data=candleCache[ticker]?.data;
  const s=stocks.find(x=>x.t===ticker);
  const closes=data?.c?.filter(Boolean)||[];
  const W=wrap.offsetWidth||300, H=70;
  const dpr=window.devicePixelRatio||1;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  const ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  if(closes.length<2) return;
  const n=closes.length;
  const min=Math.min(...closes)*0.998, max=Math.max(...closes)*1.002;
  const range=max-min||1;
  const xS=W/(n-1), yS=(H-8)/range;
  const px=i=>i*xS, py=v=>H-4-(v-min)*yS;
  const isUp=(s?.c||0)>=0;
  // gradient
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,isUp?'rgba(0,230,118,0.25)':'rgba(255,68,102,0.2)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.moveTo(px(0),py(closes[0]));
  for(let i=1;i<n;i++) ctx.lineTo(px(i),py(closes[i]));
  ctx.lineTo(px(n-1),H);ctx.lineTo(0,H);ctx.closePath();
  ctx.fillStyle=grad;ctx.fill();
  // line
  ctx.beginPath();ctx.strokeStyle=isUp?'#00e676':'#ff4466';ctx.lineWidth=1.5;ctx.lineJoin='round';ctx.lineCap='round';
  ctx.moveTo(px(0),py(closes[0]));
  for(let i=1;i<n;i++) ctx.lineTo(px(i),py(closes[i]));
  ctx.stroke();
  // S1/R1 lines
  const lvl=getLevels(ticker,s?.p||closes[n-1]);
  if(lvl.s1>min&&lvl.s1<max){ctx.strokeStyle='rgba(255,68,102,0.5)';ctx.lineWidth=0.5;ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(0,py(lvl.s1));ctx.lineTo(W,py(lvl.s1));ctx.stroke();}
  if(lvl.r1>min&&lvl.r1<max){ctx.strokeStyle='rgba(0,230,118,0.4)';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(0,py(lvl.r1));ctx.lineTo(W,py(lvl.r1));ctx.stroke();}
  ctx.setLineDash([]);
  // current price dot
  if(s?.p>0){const cy=py(s.p);ctx.beginPath();ctx.arc(W-3,cy,3,0,Math.PI*2);ctx.fillStyle=isUp?'#00e676':'#ff4466';ctx.fill();}
}

  if(resultEl) resultEl.innerHTML=(res||'❌ ไม่ได้รับข้อมูล').replace(/\n/g,'<br>');

let _chatHistory={};
async function sendAIChat(ticker){
  const input=document.getElementById('ai-chat-input-'+ticker);
  const resultEl=document.getElementById('ai-result-'+ticker);
  if(!input||!resultEl) return;
  const text=input.value.trim();
  if(!text) return;
  input.value='';
  if(!_chatHistory[ticker]) _chatHistory[ticker]=[];
  _chatHistory[ticker].push({role:'user',content:text});
  resultEl.textContent='⏳ กำลังตอบ...';
  const history=_chatHistory[ticker].map(m=>m.role+': '+m.content).join('\n');
  const res=await callAI('คุณคือนักวิเคราะห์หุ้น ตอบภาษาไทย กระชับ',history,500);
  if(_chatHistory[ticker].length>10) _chatHistory[ticker]=_chatHistory[ticker].slice(-10);
  const reply=res||'ไม่ได้รับข้อมูล';
  _chatHistory[ticker].push({role:'assistant',content:reply});
  if(resultEl) resultEl.innerHTML=reply.replace(/\n/g,'<br>');
}

function renderAlertsList(){
  const nearS=stocks.filter(s=>s.s1>0&&s.p>0&&((s.p-s.s1)/s.s1*100)<=NEAR_S_PCT).sort((a,b)=>((a.p-a.s1)/a.s1)-((b.p-b.s1)/b.s1));
  const nearR=stocks.filter(s=>s.r1>0&&s.p>0&&((s.r1-s.p)/s.r1*100)<=NEAR_S_PCT).sort((a,b)=>((a.r1-a.p)/a.r1)-((b.r1-b.p)/b.r1));
  const listS=document.getElementById('alertListS');
  const listR=document.getElementById('alertListR');
  if(listS){
    if(!nearS.length){listS.innerHTML='<div class="alert-empty">ไม่มีสัญญาณ</div>';}
    else listS.innerHTML=nearS.map(s=>{

    }).join('');

  if(listR){
    if(!nearR.length){listR.innerHTML='<div class="alert-empty">ไม่มีสัญญาณ</div>';}
    else listR.innerHTML=nearR.map(s=>{
      const pctVal=((s.r1-s.p)/s.r1*100).toFixed(1);

      </div>`;
    }).join('');
  }
}

async function loadEarnings(){
  const loading=document.getElementById('earnLoading');
  const list=document.getElementById('earnList');
  if(!loading||!list) return;
  loading.style.display='block'; list.style.display='none';
  // สร้าง list จาก stocks + fetch earnings data
  const items=[];
  await Promise.all(stocks.slice(0,20).map(async s=>{
    try{
      const url=`https://finnhub.io/api/v1/calendar/earnings?symbol=${s.t}&from=${new Date().toISOString().slice(0,10)}&to=${new Date(Date.now()+30*86400000).toISOString().slice(0,10)}`;
      const r=await fetch(`${WORKER}/finnhub/calendar/earnings?symbol=${s.t}&from=${new Date().toISOString().slice(0,10)}&to=${new Date(Date.now()+30*86400000).toISOString().slice(0,10)}`);
      if(!r.ok) return;
      const d=await r.json();
      if(d.earningsCalendar?.length){
        d.earningsCalendar.forEach(e=>items.push({ticker:s.t,name:s.n,date:e.date,eps:e.epsEstimate,rev:e.revenueEstimate}));
      }
    }catch{}
  }));
  items.sort((a,b)=>new Date(a.date)-new Date(b.date));
  loading.style.display='none'; list.style.display='flex';
  if(!items.length){list.innerHTML='<div class="empty">ไม่มีข้อมูล Earnings</div>';return;}
  const today=new Date().toISOString().slice(0,10);
  list.innerHTML=items.map(e=>{
    const days=Math.ceil((new Date(e.date)-new Date())/86400000);
    const badge=days===0?'<span class="earn-badge today">วันนี้</span>':days<=7?`<span class="earn-badge soon">${days} วัน</span>`:`<span class="earn-badge past">${e.date}</span>`;
    return `<div class="earn-item">
      <div class="earn-header">
        <div><div class="earn-ticker">${e.ticker}</div><div style="font-size:11px;color:var(--dim)">${e.name}</div></div>
        ${badge}
      </div>
      ${e.eps?`<div class="earn-detail">EPS Est: $${fmt(e.eps)} ${e.rev?'· Rev: $'+fmt(e.rev/1e9,1)+'B':''}</div>`:''}
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════
// PORTFOLIO
// ═══════════════════════════════════════════
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function confirmAddPort(){
  const ticker=document.getElementById('portTicker').value.trim().toUpperCase();
  const shares=parseFloat(document.getElementById('portShares').value);
  const cost=parseFloat(document.getElementById('portCost').value);
  if(!ticker||!shares||!cost){alert('กรุณากรอกข้อมูลให้ครบ');return;}
  portfolio.push({ticker,shares,cost,added:Date.now()});
  localStorage.setItem('v3_portfolio',JSON.stringify(portfolio));
  closeModal('addPortModal');
  document.getElementById('portTicker').value='';
  document.getElementById('portShares').value='';
  document.getElementById('portCost').value='';
  renderPortfolioPage();
}
function removePosition(i){
  portfolio.splice(i,1);
  localStorage.setItem('v3_portfolio',JSON.stringify(portfolio));
  renderPortfolioPage();
}
function renderPortfolioPage(){
  const list=document.getElementById('portList');
  const totalEl=document.getElementById('portTotal');
  const pnlEl=document.getElementById('portPnl');
  if(!list) return;
  if(!portfolio.length){list.innerHTML='<div class="empty">ยังไม่มีหุ้นในพอร์ต</div>';totalEl.textContent='$0.00';pnlEl.textContent='—';return;}
  let totalValue=0, totalCost=0;
  const items=portfolio.map((pos,i)=>{
    const s=stocks.find(x=>x.t===pos.ticker);
    const price=s?.p||pos.cost;
    const value=price*pos.shares;
    const costTotal=pos.cost*pos.shares;
    const pnl=value-costTotal;
    const pnlPct=((pnl/costTotal)*100).toFixed(2);
    totalValue+=value; totalCost+=costTotal;
    const isPos=pnl>=0;
    const barPct=Math.min(100,Math.abs(+pnlPct));
    return `<div class="port-item">
      <div class="port-item-top">
        <div>
          <div style="font-family:var(--mono);font-size:13px;font-weight:700">${pos.ticker}</div>
          <div style="font-size:11px;color:var(--dim);margin-top:2px">${fmt(pos.shares,0)} หุ้น · ต้นทุน $${fmt(pos.cost)}</div>
        </div>
        <div style="text-align:right">
          <div style="font-family:var(--mono);font-size:13px;font-weight:700">$${fmt(value)}</div>
          <div style="font-family:var(--mono);font-size:11px;color:${isPos?'var(--green)':'var(--red)'};margin-top:2px">${isPos?'+':''}$${fmt(pnl)} (${isPos?'+':''}${pnlPct}%)</div>
        </div>
      </div>
      <div class="port-pnl-bar"><div class="port-pnl-fill ${isPos?'pos':'neg'}" style="width:${barPct}%"></div></div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--dim);font-family:var(--mono)">
        <span>ราคาปัจจุบัน $${fmt(price)}</span>
        <button style="background:none;border:none;color:var(--red);font-size:10px;cursor:pointer;font-family:var(--mono)" onclick="removePosition(${i})">ลบ</button>
      </div>
    </div>`;
  });
  list.innerHTML=items.join('');
  const totalPnl=totalValue-totalCost;
  const totalPnlPct=((totalPnl/totalCost)*100).toFixed(2);
  totalEl.textContent='$'+fmt(totalValue);
  pnlEl.className='port-pnl '+(totalPnl>=0?'pos':'neg');
  pnlEl.textContent=(totalPnl>=0?'+':'')+'$'+fmt(totalPnl)+' ('+( totalPnl>=0?'+':'')+totalPnlPct+'%)';
}

// ═══════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════
function goPage(name, el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');
  if(el) el.classList.add('active');
  if(name==='earnings') loadEarnings();
  if(name==='alerts'){document.getElementById('alertBadge').style.display='none';renderAlertsList();}
  if(name==='portfolio') renderPortfolioPage();
}
function goCardFocus(ticker){
  goPage('watchlist',document.querySelector('.nav-tab'));
  setTimeout(()=>{
    const card=document.getElementById('card-'+ticker);
    if(card) card.scrollIntoView({behavior:'smooth',block:'center'});
  },100);
}

  renderCards();
  updateMktBar();
  setInterval(updateMktBar,60000);

  await toggleLive();

init();
